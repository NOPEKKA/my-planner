    renderProjectSheet({ ...p, status: b.dataset.s }, editIdx);
  });
  const addIdea = () => {
    const t = $('#ideaInput').value.trim(); if (!t) return;
    const ideasNew = [...noteArr, { at:new Date().toISOString(), text:t }];
    Store.update('projects', id, { ideas: ideasNew });
    renderProjectSheet({ ...p, ideas: ideasNew });
  };
  $('#ideaAdd').onclick = addIdea;

  $('#ideaList').querySelectorAll('.idea-edit-btn').forEach(b => b.onclick = () => renderProjectSheet(p, +b.dataset.i));
  const cancel = $('#ideaList').querySelector('.idea-cancel'); if (cancel) cancel.onclick = () => renderProjectSheet(p);
  const saveBtn = $('#ideaList').querySelector('.idea-save');
  if (saveBtn) saveBtn.onclick = () => {
    const t = $('#ideaList .idea-edit').value.trim(); if (!t) return;
    const ideasNew = noteArr.map((x,j)=> j===+saveBtn.dataset.i ? {...x, text:t} : x);
    Store.update('projects', id, { ideas: ideasNew });
    renderProjectSheet({ ...p, ideas: ideasNew });
  };
  $('#ideaList').querySelectorAll('.idea-del').forEach(b => b.onclick = () => {
    askConfirm('ลบบันทึกนี้?', 'ลบ', () => {
      const ideasNew = noteArr.filter((_,j)=>j!==+b.dataset.i);
      Store.update('projects', id, { ideas: ideasNew });
      renderProjectSheet({ ...p, ideas: ideasNew });
    });
  });

  $('#projEdit').onclick = () => openSheet('projects', p);
  $('#projDel').onclick = () => askConfirm('ลบโปรเจกต์นี้?', 'ลบ', () => { Store.remove('projects', id); closeSheet(); });
}

/* ===================== ปฏิทินรายเดือน ===================== */
let calY = new Date().getFullYear(), calM = new Date().getMonth();
let calSel = startOfDay(new Date()).toISOString();
const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

function sameYMD(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function itemsOn(date){
  return { hw: Store.all('homework').filter(h => sameYMD(new Date(h.dueAt), date)),
           ap: Store.all('appts').filter(a => sameYMD(new Date(a.at), date)),
           ex: Store.all('exams').filter(e => sameYMD(new Date(e.at), date)) };
}
function dayISO(d, time){ const [hh,mm]=time.split(':'); const x=new Date(d); x.setHours(+hh,+mm,0,0); return x.toISOString(); }
function sameWeek(a, b){ return sameYMD(mondayOf(a), mondayOf(b)); }
function routineTasksOn(date){
  return Store.all('routines').filter(r => {
    if (r.repeat==='monthly') return domOn(r.dom, date);
    if (!r.date) return false;
    const dl = new Date(r.date+'T00:00:00');
    return r.countdown ? sameWeek(date, dl) : sameYMD(dl, date);   // งานสัปดาห์ = ทั้งสัปดาห์, งานวันที่ = เฉพาะวันนั้น
  }).sort((a,b)=> (a.allDay||a.countdown?0:1)-(b.allDay||b.countdown?0:1) || (a.time||'').localeCompare(b.time||''));
}

function renderCal(){
  const root = $('#calContent'); root.innerHTML = ''; root.className = 'cal-layout';
  const calL = el('div','cal-left'), calR = el('div','cal-right'); root.append(calL, calR);
  let box = calL;
  const today = new Date(), selDate = new Date(calSel);

  const head = el('div','cal-head');
  const prev = el('button','', ARROW_L), next = el('button','', ARROW_R);
  prev.onclick = ()=>{ if(--calM<0){calM=11;calY--;} renderCal(); };
  next.onclick = ()=>{ if(++calM>11){calM=0;calY++;} renderCal(); };
  const tb = el('button','today-btn','วันนี้');
  tb.onclick = ()=>{ calY=today.getFullYear(); calM=today.getMonth(); calSel=startOfDay(today).toISOString(); renderCal(); };
  head.append(prev, el('div','mo', `${TH_MON_FULL[calM]} ${calY+543}`), next, tb);
  box.appendChild(head);

  const legend = el('div','cal-legend');
  legend.innerHTML = `<span><i style="background:var(--c-appt)"></i>นัด</span><span><i style="background:var(--exam)"></i>สอบ</span><span><i style="background:var(--c-hw)"></i>การบ้าน</span><span><i style="background:var(--routine)"></i>วันสำคัญ</span><span><i style="background:var(--c-todo)"></i>สิ่งที่ต้องทำ</span>`;
  box.appendChild(legend);

  const grid = el('div','cal-grid');
  ['จ','อ','พ','พฤ','ศ','ส','อา'].forEach(d => grid.appendChild(el('div','cal-dow', d)));
  const first = new Date(calY, calM, 1);
  const start = new Date(calY, calM, 1 - ((first.getDay()+6)%7)); // เริ่มจากวันจันทร์
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const inMonth = d.getMonth()===calM && d.getFullYear()===calY;
    const cell = el('div','cal-cell' + (inMonth?'':' dim') + (sameYMD(d,today)?' today':'') + (sameYMD(d,selDate)?' sel':''));
    cell.appendChild(el('div','dn', String(d.getDate())));
    const {hw, ap, ex} = itemsOn(d);
    if (ex.length) cell.classList.add('has-exam');
    const occList = Store.all('occasions').filter(o=>occursOn(o, d)), occHere = occList.length > 0;
    const dayTasks = Store.all('routines').filter(r => {
      if (r.countdown) return false;
      if (r.repeat==='monthly') return domOn(r.dom, d);
      return r.date && !r.done && sameYMD(new Date(r.date+'T00:00:00'), d);
    }), dayTask = dayTasks.length > 0;
    // ชื่อรายการในช่อง (โชว์บนคอม): สอบก่อน แล้วการบ้าน นัด วันสำคัญ สิ่งที่ต้องทำ
    const byAt = (a, b) => new Date(a.at || a.dueAt) - new Date(b.at || b.dueAt);
    const chips = [ ...ex.slice().sort(byAt).map(e => ['ex', 'สอบ ' + e.subject]),
      ...hw.slice().sort(byAt).map(x => ['hw' + (x.done ? ' done' : ''), x.title]),
      ...ap.slice().sort(byAt).map(a => ['ap', fmtTime(new Date(a.at)) + ' ' + a.title]),
      ...occList.map(o => ['oc', o.title]), ...dayTasks.map(r => ['rt', r.title]) ];
    const weekTask = Store.all('routines').some(r => r.countdown && !r.done && r.date && sameWeek(d, new Date(r.date+'T00:00:00')));
    if (hw.length || ap.length || ex.length || occHere || dayTask || weekTask){
      const dots = el('div','cal-dots');
      if (ex.length) dots.appendChild(el('i','ex'));
      if (hw.length) dots.appendChild(el('i','hw'));
      if (ap.length) dots.appendChild(el('i','ap'));
      if (occHere) dots.appendChild(el('i','oc'));
      if (dayTask) dots.appendChild(el('i','rt'));
      if (weekTask) dots.appendChild(el('i','rtw'));
      cell.appendChild(dots);
    }
    if (chips.length) {
      const cc = el('div','cal-chips'), MAXC = 3, shown = chips.length > MAXC ? MAXC - 1 : MAXC;
      chips.slice(0, shown).forEach(([k, t]) => { const s = el('span', 'cc ' + k, esc(t)); s.title = t; cc.appendChild(s); });
      if (chips.length > shown) cc.appendChild(el('span','cc more', `+ อีก ${chips.length - shown}`));
      cell.appendChild(cc);
    }
    const dd = new Date(d);
    cell.onclick = ()=>{ calSel = startOfDay(dd).toISOString(); calM = dd.getMonth(); calY = dd.getFullYear(); renderCal(); };
    grid.appendChild(cell);
  }
  box.appendChild(grid);
  box = calR;

  // รายการของวันที่เลือก
  const sd = selDate;
  box.appendChild(el('div','cal-day-head', `${TH_DAY[sd.getDay()]} ${sd.getDate()} ${TH_MON[sd.getMonth()]}`));
  const add = el('div','cal-add');
  const aHw = el('button','','+ การบ้าน'); aHw.onclick = ()=>openSheet('homework', { dueAt: dayISO(sd,'23:59') });
  const aAp = el('button','','+ นัดหมาย'); aAp.onclick = ()=>openSheet('appts', { at: dayISO(sd,'09:00') });
  const aEx = el('button','','+ สอบ'); aEx.onclick = ()=>openSheet('exams', { at: dayISO(sd,'09:00') });
  const aOc = el('button','','+ วันสำคัญ'); aOc.onclick = ()=>openSheet('occasions', { date: ymd(sd) });
  add.append(aHw, aAp, aEx, aOc); box.appendChild(add);

  const {hw, ap, ex} = itemsOn(sd);
  const rts = routineTasksOn(sd);
  const occ = Store.all('occasions').filter(o=>occursOn(o, sd));
  const classes = Store.all('classes').filter(c=>c.day===sd.getDay()).sort((a,b)=>a.start.localeCompare(b.start));
  if (!hw.length && !ap.length && !ex.length && !classes.length && !rts.length && !occ.length){
    box.appendChild(empty('🗓️','วันนี้ยังว่าง — กดปุ่มด้านบนเพื่อเพิ่ม'));
  } else {
    if (ex.length){ box.appendChild(eyebrow('สอบ', ex.length)); ex.sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(e=>box.appendChild(examCard(e))); }
    if (classes.length){ box.appendChild(eyebrow('คาบเรียน', classes.length)); classes.forEach(c=>box.appendChild(classCard(c, true, '', sd))); }
    const weekTs = rts.filter(r=>r.countdown), dayTs = rts.filter(r=>!r.countdown);
    if (weekTs.length){ box.appendChild(eyebrow('สิ่งที่ต้องทำภายในสัปดาห์นี้', weekTs.length)); weekTs.forEach(r=>box.appendChild(todoCard(r))); }
    if (dayTs.length){ box.appendChild(eyebrow('สิ่งที่ต้องทำ', dayTs.length)); dayTs.forEach(r=>box.appendChild(todoCard(r))); }
    if (occ.length){ box.appendChild(eyebrow('วันสำคัญ', occ.length)); occ.forEach(o=>box.appendChild(occasionCard(o))); }
    if (hw.length){ box.appendChild(eyebrow('การบ้านส่งวันนี้', hw.length)); hw.sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt)).forEach(h=>box.appendChild(hwCard(h))); }
    if (ap.length){ box.appendChild(eyebrow('นัดหมาย', ap.length)); ap.sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(a=>box.appendChild(apptCard(a))); }
  }

  // รายการทั้งหมดที่จะถึง — ล่างสุด เลื่อนดูยาวๆ
  renderAgenda(box);
}

/* ===================== เพิ่มเร็วด้วยประโยคเดียว: ตัวแยกประโยค (v2) =====================
   "ส่งรายงานเคมี พรุ่งนี้ 5 โมง" → { kind:'homework', title:'รายงาน', subject:'เคมี', when: พรุ่งนี้ 17:00, spans:[…] }
   - กฎตายตัวในเครื่อง ไม่ส่งข้อความไปไหน · ใช้ได้ทั้งในเบราว์เซอร์และ Node (ไว้ทดสอบ)
   - ไม่ใช้ lookbehind ใน regex (Safari รุ่นเก่ายังไม่รองรับ)
   - spans ชี้ตำแหน่งในข้อความเดิม (แปลงตัวอักษรแบบ 1:1 เท่านั้น) ไว้ไฮไลต์คำที่อ่านได้ */
const QuickParse = (() => {
  const NUMW = { 'หนึ่ง':1,'สอง':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9,'สิบ':10,'สิบเอ็ด':11,'สิบสอง':12 };
  const NUM = '(\\d{1,2}|สิบสอง|สิบเอ็ด|สิบ|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)';
  const NUM3 = '\\d{1,3}|สิบสอง|สิบเอ็ด|สิบ|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า';   // ไม่มีวงเล็บ — ใส่กลุ่มเองตอนใช้
  const num = s => /^\d+$/.test(s) ? +s : NUMW[s];
  const PERIOD = { 'เช้า':[8,0], 'สาย':[10,0], 'บ่าย':[13,0], 'เย็น':[17,0], 'ค่ำ':[19,0], 'คืน':[21,0], 'กลางคืน':[21,0], 'ดึก':[22,0],
                   morning:[8,0], afternoon:[13,0], evening:[17,0], night:[21,0], tonight:[21,0] };
  const PER = '(กลางคืน|เช้า|สาย|บ่าย|เย็น|ค่ำ|คืน|ดึก)';
  const NOT_NUM = '(?!\\s*(?:\\d|โมง|สิบ|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|ครึ่ง))';
  // ช่วงเวลาที่ต่อท้ายวัน เช่น "พรุ่งนี้เย็น" (แต่ไม่กิน "บ่าย" ใน "พรุ่งนี้บ่าย 3")
  const PER_AFTER = `(?:\\s*(?:ตอน)?${PER}${NOT_NUM})?`;
  const EN_PER = '(?:\\s+(morning|afternoon|evening|night))?';
  const MONTHS = [['มกราคม','มกรา','ม.ค.','มค'],['กุมภาพันธ์','กุมภา','ก.พ.','กพ'],['มีนาคม','มีนา','มี.ค.','มีค'],['เมษายน','เมษา','เม.ย.','เมย'],
                  ['พฤษภาคม','พฤษภา','พ.ค.','พค'],['มิถุนายน','มิถุนา','มิ.ย.','มิย'],['กรกฎาคม','กรกฎา','ก.ค.','กค'],['สิงหาคม','สิงหา','ส.ค.','สค'],
                  ['กันยายน','กันยา','ก.ย.','กย'],['ตุลาคม','ตุลา','ต.ค.','ตค'],['พฤศจิกายน','พฤศจิกา','พ.ย.','พย'],['ธันวาคม','ธันวา','ธ.ค.','ธค']];
  const EN_MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const EN_MON_RE = '(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\\.?';
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const MON_ALT = MONTHS.flatMap((ns, i) => ns.map(n => [n, i])).sort((a, b) => b[0].length - a[0].length);
  const MON_RE = '(' + MON_ALT.map(([n]) => escRe(n)).join('|') + ')';
  const monIdx = s => MON_ALT.find(([n]) => n === s)[1];
  const enMonIdx = s => EN_MON.indexOf(s.toLowerCase().slice(0, 3));
  const DOW_ALT = [['อาทิตย์',0],['จันทร์',1],['อังคาร',2],['พุธ',3],['พฤหัสบดี',4],['พฤหัส',4],['ศุกร์',5],['เสาร์',6]];
  const DOW_RE = '(' + DOW_ALT.map(([n]) => n).join('|') + ')';
  const EN_DOW_RE = '(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)';
  const EN_DOW = ['sun','mon','tue','wed','thu','fri','sat'];
  // ชื่อย่อวันแบบมีจุด (ใช้เฉพาะตอนเพิ่มคาบเรียน) — ไม่กิน "ส.ค." หรือ "อ.สมชาย"
  const DOW_SHORT_RE = '(อา|พฤ|จ|อ|พ|ศ|ส)\\.(?=\\s|$|,|\\d|-)';
  const DOW_SHORT = { 'อา':0,'จ':1,'อ':2,'พ':3,'พฤ':4,'ศ':5,'ส':6 };
  const dowOf = t => { const l = t.toLowerCase().replace(/\.$/, ''); const th = DOW_ALT.find(([n]) => n === t); if (th) return th[1];
    if (DOW_SHORT[l] != null) return DOW_SHORT[l]; return EN_DOW.indexOf(l.slice(0, 3)); };

  // ชื่อเล่นวิชา → ชื่อเต็ม (ภาษาอังกฤษจับเฉพาะทั้งคำ)
  const ALIAS = { 'คณิต':'คณิตศาสตร์', 'วิทย์':'วิทยาศาสตร์', 'ชีวะ':'ชีววิทยา', 'คอม':'คอมพิวเตอร์', 'อิ้ง':'ภาษาอังกฤษ', 'อังกฤษ':'ภาษาอังกฤษ',
                  'ไทย':'ภาษาไทย', 'จีน':'ภาษาจีน', 'ญี่ปุ่น':'ภาษาญี่ปุ่น', 'สังคม':'สังคมศึกษา', 'ประวัติ':'ประวัติศาสตร์', 'พละ':'พลศึกษา',
                  'สุขะ':'สุขศึกษา', 'ภูมิศาสตร์':'ภูมิศาสตร์', 'เศรษฐศาสตร์':'เศรษฐศาสตร์',
                  'math':'คณิตศาสตร์', 'maths':'คณิตศาสตร์', 'sci':'วิทยาศาสตร์', 'science':'วิทยาศาสตร์', 'phy':'ฟิสิกส์', 'physics':'ฟิสิกส์',
                  'chem':'เคมี', 'chemistry':'เคมี', 'bio':'ชีววิทยา', 'biology':'ชีววิทยา', 'eng':'ภาษาอังกฤษ', 'english':'ภาษาอังกฤษ',
                  'thai':'ภาษาไทย', 'social':'สังคมศึกษา', 'history':'ประวัติศาสตร์', 'com':'คอมพิวเตอร์', 'computer':'คอมพิวเตอร์',
                  'cs':'คอมพิวเตอร์', 'art':'ศิลปะ', 'music':'ดนตรี', 'pe':'พลศึกษา', 'chinese':'ภาษาจีน', 'japanese':'ภาษาญี่ปุ่น' };
  const COMMON = ['คณิตศาสตร์','วิทยาศาสตร์','ฟิสิกส์','เคมี','ชีววิทยา','ภาษาไทย','ภาษาอังกฤษ','ภาษาจีน','ภาษาญี่ปุ่น','ภาษาฝรั่งเศส','สังคมศึกษา',
                  'ประวัติศาสตร์','ภูมิศาสตร์','คอมพิวเตอร์','ศิลปะ','ดนตรี','พลศึกษา','สุขศึกษา','การงานอาชีพ','เศรษฐศาสตร์'];
  const isLatin = s => /^[a-z0-9 .]+$/i.test(s);
  function findNeedle(low, n){
    if (isLatin(n)) { const m = new RegExp(`(^|[^a-z])${escRe(n)}(?![a-z])`, 'i').exec(low); return m ? m.index + m[1].length : -1; }
    return low.indexOf(n);
  }
  // "วันภาษาไทย", "วันวิทยาศาสตร์" = ชื่องาน ไม่ใช่วิชา → ปิดทั้งวลีก่อนค้นหา (ความยาวเท่าเดิม)
  const DAY_OF_SUBJECT = new RegExp('วัน(' + COMMON.map(escRe).join('|') + ')', 'g');
  function findSubject(text, subjects, taught = {}){
    const low = String(text || '').toLowerCase().replace(DAY_OF_SUBJECT, m => '#'.repeat(m.length)), cands = [];
    const add = (needle, name, pri = 0) => { if (needle && needle.length >= 2) cands.push([needle, name, pri]); };
    const own = full => subjects.find(s => s === full || s.startsWith(full) || (s.length >= 3 && full.startsWith(s))) || full;
    Object.entries(taught).forEach(([w, name]) => add(w, name, 2));   // คำที่ผู้ใช้สอน ('' = ไม่ใช่ชื่อวิชา)
    subjects.forEach(s => { add(s, s, 1); add(s.split(/\s+/)[0], s, 1); add(s.replace(/^ภาษา/, ''), s, 1); add(s.replace(/(ศาสตร์|ศึกษา)$/, ''), s, 1); });
    Object.entries(ALIAS).forEach(([a, full]) => add(a, own(full)));
    COMMON.forEach(s => add(s, own(s)));
    let best = null;
    for (const [n, name, pri] of cands) {
      const i = findNeedle(low, n.toLowerCase());
      if (i < 0) continue;
      if (!best || n.length > best.n.length || (n.length === best.n.length && pri > best.pri)) best = { n: String(text).substr(i, n.length), name, i, pri };
    }
    return best && best.name === '' ? null : best;
  }
  // เดาคำย่อที่ผู้ใช้ใช้เรียกวิชา เช่น "ส่งรายงานชีวะ" + ชีววิทยา → "ชีวะ"
  function guessAlias(text, name){
    const t = String(text || ''); if (!name) return '';
    for (let len = Math.min(name.length, 8); len >= 2; len--) {
      const i = t.indexOf(name.slice(0, len));
      if (i >= 0) { let j = i + len; while (j < t.length && /[ะ-ฺ็-๎]/.test(t[j])) j++; return t.slice(i, j); }
    }
    const m = t.match(/[a-z]{2,12}/i);

function buildTabs() {
  const bar = $('#tabBar');
  MAIN_TABS.forEach(id => {
    const t = TABS.find(x => x.id === id);
    const b = el('button', '', `<span class="ic">${svgI(t.icon)}</span><span class="lb">${t.label}</span>`);
    b.dataset.tab = id; b.onclick = () => switchTab(id); bar.appendChild(b);
  });
  const more = el('button'); more.id = 'moreTab'; more.onclick = openMoreSheet; bar.appendChild(more);
  const side = $('#sideNav');
  TABS.forEach(t => {
    const b = el('button', '', `${svgI(t.icon)}<span>${TITLES[t.id]}</span>`);
    b.dataset.tab = t.id; b.onclick = () => switchTab(t.id); side.appendChild(b);
  });
  syncTabs();
}
// ปุ่มที่ 5 บนมือถือ: ถ้าอยู่หน้าที่อยู่ใน "เพิ่มเติม" จะโชว์ชื่อหน้านั้นแทน
function syncTabs(){
  document.querySelectorAll('#tabBar button[data-tab], #sideNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === curTab));
  const more = $('#moreTab'), inMore = !MAIN_TABS.includes(curTab), t = TABS.find(x => x.id === curTab);
  more.classList.toggle('active', inMore);
  more.innerHTML = `<span class="ic">${svgI(inMore ? t.icon : MORE_ICON)}</span><span class="lb">${inMore ? t.label : 'เพิ่มเติม'}</span>`;
}
function openMoreSheet(){
  const dow = new Date().getDay();
  const items = [
    ['class', `${Store.all('classes').filter(c => c.day === dow).length} คาบวันนี้`],
    ['proj',  `${Store.all('projects').filter(p => p.status !== 'done').length} กำลังทำ / ไอเดีย`],
    ['note',  `${Store.all('notes').filter(isRootNote).length} โน้ต · ${noteTopics().length} หัวข้อ`],
  ];
  showRawSheet('<h2>เพิ่มเติม</h2><div class="more-list">' + items.map(([id, sub]) => {

           `<span class="mr-txt"><b>${TITLES[id]}</b><span>${sub}</span></span><span class="mr-chev">›</span></button>`;

  $('#sheetBody').querySelectorAll('.more-row').forEach(b => b.onclick = () => { closeSheet(); switchTab(b.dataset.tab); });

const VIEW_W = { today:'narrow', hw:'narrow', appt:'narrow', cal:'wide', week:'wide' };
function applyViewWidth(id){ const a = document.querySelector('.app'); if (a) a.dataset.w = VIEW_W[id] || ''; }
function switchTab(id) {
  if (id === 'note' && curTab === 'note' && noteOpen) { noteOpen = null; noteQuery = ''; }
  curTab = id;
  applyViewWidth(id);
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

function openSheet(coll, item) {

  sheetState = { coll, id: item?.id || null, color: item?.color ?? (coll==='classes' ? COLOR_OPTS[0] : ''),
                 days: item?.days ? [...item.days] : [1,2,3,4,5], online: item?.online || false,
                 status: item?.status || (coll === 'projects' && curTab === 'proj' && window.matchMedia && matchMedia('(max-width: 899px)').matches ? projCol : 'idea'),
                 repeat: item?.repeat || (item?.date ? 'once' : 'weekly'), done: item?.done || false,
                 timeMode: item?.countdown ? 'week' : (item?.allDay ? 'allday' : 'time'),
                 weekWhich: (item?.countdown && item?.date && new Date(item.date+'T23:59:00') > endOfWeek(new Date(),0)) ? 'next' : 'this',
                 occRepeat: item?.repeat || 'yearly',

// ---- แปลงลิงก์ในข้อความให้กดได้ (escape ก่อนเสมอ) ----
function linkifyNote(text){
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const re = /(https?:\/\/[^\s]+)/g; let out='', last=0, m;
  while ((m = re.exec(text))){
    out += e(text.slice(last, m.index));
    const url = m[1];
    out += `<a href="${e(url)}" target="_blank" rel="noopener" class="note-link">${e(url.replace(/^https?:\/\/(www\.)?/,''))}</a>`;
    last = m.index + url.length;
  }
  out += e(text.slice(last));
  return out;
}

/* ---------- ช่องค้นหา (ใช้ร่วม โน้ต/โปรเจกต์) ---------- */
function matchQ(q, ...parts){
  const hay = parts.flat().filter(Boolean).join('\n').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));   // ทุกคำต้องเจอ
}
function searchBar(id, placeholder, value, onInput){
  const w = el('div','search');
  w.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="${id}" type="search" enterkeyhint="search" autocomplete="off" placeholder="${attr(placeholder)}" value="${attr(value)}">
    <button type="button" class="s-clear${value?'':' hidden'}" aria-label="ล้างคำค้น">✕</button>`;
  const inp = w.querySelector('input'), clr = w.querySelector('.s-clear');
  inp.oninput = () => { clr.classList.toggle('hidden', !inp.value); onInput(inp.value); };
  inp.onkeydown = e => { if (e.key === 'Escape' && inp.value) { inp.value = ''; inp.oninput(); } };
  clr.onclick = () => { inp.value = ''; clr.classList.add('hidden'); onInput(''); inp.focus(); };
  return w;
}
// เรนเดอร์ใหม่ (เช่น ข้อมูลซิงค์เข้ามา) แล้วยังพิมพ์ค้นหาต่อได้
function keepFocus(id){ const a = document.activeElement; return a && a.id === id ? [a.selectionStart, a.selectionEnd] : null; }
function restoreFocus(id, sel){ if (!sel) return; const i = document.getElementById(id); if (i){ i.focus(); try { i.setSelectionRange(sel[0], sel[1]); } catch {} } }

/* ---------- โน้ต: หัวข้อ (หมวด) + โน้ตแบบโฟลเดอร์ ---------- */
// หัวข้อ = หมวดแยกโน้ต (collection 'topics', note.topic)
// โน้ตโฟลเดอร์ = note.isFolder → ในรายการโชว์แค่ชื่อ กดเข้าไปเห็นข้อความทั้งหมด + โน้ตข้างใน (note.parent = id โฟลเดอร์)
let noteQuery = '', noteTopic = 'all', noteOpen = null;   // noteOpen = id โน้ตโฟลเดอร์ที่เปิดอยู่
const noteTopics = () => Store.all('topics').slice().sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));
const noteById = id => Store.all('notes').find(n => n.id === id);
const noteKids = id => Store.all('notes').filter(n => n.parent === id);
const isRootNote = n => !n.parent || !noteById(n.parent);        // parent หาย (ซิงค์ไม่ครบ) → โชว์ข้างนอก
const noteSort = (a,b) => (a.order??1e9)-(b.order??1e9) || (b.updatedAt||0)-(a.updatedAt||0);
const noteText = n => [n.title, n.text, (n.checklist||[]).map(x=>x.text), (n.sections||[]).flatMap(s=>[s.head, s.body])];
function noteRoot(n){ const seen = new Set(); while (n && n.parent && !seen.has(n.id)){ seen.add(n.id); const p = noteById(n.parent); if (!p) break; n = p; } return n; }
function noteDesc(id){   // ทุกอย่างที่อยู่ในโฟลเดอร์ (ลึกทุกชั้น)
  const out = [], seen = new Set([id]);
  const walk = pid => noteKids(pid).forEach(k => { if (seen.has(k.id)) return; seen.add(k.id); out.push(k); walk(k.id); });
  walk(id); return out;
}
function openNoteFolder(id){ noteOpen = id; noteQuery = ''; revealedId = null; renderNotes(); window.scrollTo(0, 0); }

function renderNotes(){
  const box = $('#noteContent'); const focus = keepFocus('noteSearch'); box.innerHTML = '';
  const f = noteOpen && noteById(noteOpen);
  if (f && f.isFolder) renderNoteFolderPage(box, f);
  else { noteOpen = null; renderNoteRoot(box); }
  restoreFocus('noteSearch', focus);
}
function renderNoteRoot(box){
  const topics = noteTopics(), roots = Store.all('notes').filter(isRootNote);
  if (noteTopic !== 'all' && !topics.some(t => t.id === noteTopic)) noteTopic = 'all';
  const cur = topics.find(t => t.id === noteTopic);
  box.appendChild(searchBar('noteSearch', cur ? `ค้นหาในหัวข้อ ${cur.name}` : 'ค้นหาโน้ต', noteQuery, q => { noteQuery = q; renderNoteList(); }));

    return b;
  };
  bar.appendChild(chip('all', 'ทั้งหมด', roots.length));

function renderNoteFolderPage(box, f){
  const parent = f.parent && noteById(f.parent);
  const back = el('button','nf-back', '‹ ' + esc(parent ? parent.title || 'โฟลเดอร์' : 'โน้ตทั้งหมด'));

  box.appendChild(back);

  // ตัวโฟลเดอร์: ชื่อ + ข้อความเต็ม
  const page = el('div','card note-card nf-page');
  page.appendChild(el('div','nf-kicker','โฟลเดอร์'));

  box.appendChild(page);

  const kids = noteKids(f.id);
  if (kids.length > 1) box.appendChild(searchBar('noteSearch', `ค้นหาใน ${f.title}`, noteQuery, q => { noteQuery = q; renderNoteList(); }));
  box.appendChild(eyebrow('ในโฟลเดอร์นี้', kids.length));
  const list = el('div'); list.id = 'noteList'; box.appendChild(list);
  renderNoteList();
  const add = el('button','ck-add nf-add','+ เพิ่มโน้ตในโฟลเดอร์'); add.onclick = () => openSheet('notes', null);
  box.appendChild(add);
}
function renderNoteList(){
  const box = $('#noteList'); if (!box) return; box.innerHTML = '';
  const topics = noteTopics(), tname = id => topics.find(t => t.id === id)?.name || '';
  let scope;
  if (noteOpen) scope = noteKids(noteOpen).sort(noteSort);
  else {
    if (!Store.all('notes').length){ box.appendChild(empty('📝','ยังไม่มีโน้ต — กดปุ่ม + จดอะไรก็ได้ (วางลิงก์แล้วกดเปิดได้)')); return; }
    scope = Store.all('notes').filter(isRootNote).sort(noteSort);
    if (noteTopic !== 'all') scope = scope.filter(n => n.topic === noteTopic);
  }
  const q = noteQuery.trim();
  if (q) {   // ค้นลึกเข้าไปในโฟลเดอร์ด้วย · ไม่ให้เลื่อนลำดับระหว่างกรอง
    const pool = noteOpen ? noteDesc(noteOpen) : scope.flatMap(n => [n, ...noteDesc(n.id)]);
    const where = n => { const p = n.parent && noteById(n.parent); return p && p.id !== noteOpen ? '📁 ใน ' + (p.title || 'โฟลเดอร์') : (!noteOpen && n.topic ? '# ' + tname(n.topic) : ''); };
    const hits = pool.filter(n => matchQ(q, noteText(n), tname(noteRoot(n).topic)));
    box.appendChild(el('div','search-count', hits.length ? `พบ ${hits.length} โน้ต` : ''));
    if (!hits.length) box.appendChild(empty('🔍', `ไม่พบโน้ตที่มีคำว่า “${esc(q)}”`));
    hits.forEach(n => box.appendChild(noteCard(n, where(n))));
    return;
  }
  if (!scope.length){
    if (!noteOpen) box.appendChild(empty('🏷️','หัวข้อนี้ยังว่าง — กดปุ่ม + เพื่อจดโน้ตในหัวข้อนี้'));
    else box.appendChild(el('div','nf-empty','ยังไม่มีอะไรข้างใน — เพิ่มโน้ต หรือโฟลเดอร์ย่อยได้เลย'));
    return;
  }
  const tag = n => (!noteOpen && noteTopic === 'all' && n.topic) ? '# ' + tname(n.topic) : '';
  scope.forEach(n => box.appendChild(reorderWrap(noteCard(n, tag(n)), 'notes', scope, n.id)));
}
function deleteNoteFolder(f){
  const kids = noteKids(f.id);
  askConfirm(kids.length ? `ลบโฟลเดอร์ “${f.title}”? โน้ต ${kids.length} รายการข้างในจะย้ายออกมาไว้ข้างนอก (ไม่ถูกลบ)` : `ลบโฟลเดอร์ “${f.title}”?`, 'ลบ', () => {
    kids.forEach(k => Store.update('notes', k.id, { parent: f.parent || '', topic: f.topic || '' }));
    noteOpen = f.parent || null;
    Store.remove('notes', f.id);
  });
}
function openTopicSheet(t){
  let h = `<h2>${t ? 'แก้ไขหัวข้อ' : 'สร้างหัวข้อ'}</h2>`;
  h += fld('ชื่อหัวข้อ', `<input class="inp" id="f_tname" value="${attr(t?.name)}" placeholder="เช่น เรื่องเรียน / รหัส / เกม / ชีวิตประจำวัน" maxlength="30">`);
  h += `<button class="save" id="topicSave">${t ? 'บันทึก' : 'สร้างหัวข้อ'}</button>`;
  if (t) h += `<button class="del-btn" id="topicDel">ลบหัวข้อนี้</button>`;
  showRawSheet(h);
  const inp = $('#f_tname'); setTimeout(() => inp.focus(), 280);
  const save = () => {
    const name = inp.value.trim();

    if (Store.all('topics').some(x => x.id !== t?.id && x.name === name)) return warn('มีหัวข้อชื่อนี้อยู่แล้ว');
    if (t) Store.update('topics', t.id, { name });
    else noteTopic = Store.add('topics', { name, createdAt: Date.now() });
    closeSheet(); renderNotes();
  };
  $('#topicSave').onclick = save;
  inp.onkeydown = e => { if (e.key === 'Enter') save(); };
  const del = $('#topicDel');
  if (del) del.onclick = () => {
    const inside = Store.all('notes').filter(n => n.topic === t.id);
    askConfirm(inside.length ? `ลบหัวข้อ “${t.name}”? โน้ต ${inside.length} รายการยังอยู่ครบ แค่ไม่มีหัวข้อ` : `ลบหัวข้อ “${t.name}”?`, 'ลบหัวข้อ', () => {
      inside.forEach(n => Store.update('notes', n.id, { topic: '' }));
      Store.remove('topics', t.id);
      noteTopic = 'all'; closeSheet(); renderNotes();
    });
  };
}

function save() {
  const c = sheetState.coll, id = sheetState.id;
  let item = {};
  const v = sel => { const e = $(sel); return e ? e.value.trim() : ''; };

  if (c === 'classes') {
    if (!v('#f_subject')) return warn('ใส่ชื่อวิชาก่อนนะ');
    if (!sheetState.days.length) return warn('เลือกวันอย่างน้อย 1 วัน');
    const base = { subject:v('#f_subject'), start:$('#f_start').value, end:$('#f_end').value, room:v('#f_room'), color:sheetState.color, online:sheetState.online, link:v('#f_link') };
    if (id) Store.update(c, id, base);
    else sheetState.days.forEach(d => Store.add(c, {...base, day:d})); // เพิ่มหลายวันได้ในครั้งเดียว
  } else if (c === 'routines') {
    if (!v('#f_title')) return warn('ใส่ชื่อสิ่งที่ต้องทำก่อนนะ');
    const checklist = readChecklist();
    const tm = sheetState.timeMode;
    if (tm === 'week') {
      const eow = endOfWeek(new Date(), sheetState.weekWhich === 'next' ? 1 : 0);
      const o = { title:v('#f_title'), countdown:true, allDay:false, date:ymd(eow), time:'23:59', checklist, repeat:'once', done: sheetState.done };
      id ? Store.update(c, id, o) : Store.add(c, o);
      closeSheet(); switchTab('today'); return;
    } else {
      const allDay = tm === 'allday';
      const time = allDay ? '' : $('#f_time').value;
      if (sheetState.repeat === 'once') {
        const date = $('#f_date').value; if (!date) return warn('เลือกวันที่ก่อนนะ');
        const o = { title:v('#f_title'), time, allDay, countdown:false, checklist, repeat:'once', date, done: sheetState.done };
        id ? Store.update(c, id, o) : Store.add(c, o);
      } else if (sheetState.repeat === 'monthly') {
        const o = { title:v('#f_title'), time, allDay, countdown:false, checklist, repeat:'monthly', dom: +$('#f_dom').value };
        id ? Store.update(c, id, o) : Store.add(c, o);
      } else {
        if (!sheetState.days.length) return warn('เลือกวันอย่างน้อย 1 วัน');
        const o = { title:v('#f_title'), time, allDay, countdown:false, checklist, repeat:'weekly', days:[...sheetState.days] };
        id ? Store.update(c, id, o) : Store.add(c, o);
      }
    }
  } else if (c === 'notes') {
    const title = v('#f_title'), text = ($('#f_note')?.value || '').trim();
    const checklist = readChecklist();
    if (!title && !text && !checklist.length) return warn('พิมพ์อะไรสักอย่างก่อนนะ');
    if (sheetState.isFolder && !title) return warn('ตั้งชื่อโฟลเดอร์ก่อนนะ (ในรายการจะโชว์แค่ชื่อ)');
    const topicEl = $('#f_topic'), parent = sheetState.parent || '';
    const o = { title, text, checklist, color: sheetState.color, updatedAt: Date.now(), isFolder: !!sheetState.isFolder, parent,
                topic: parent ? '' : (topicEl ? topicEl.value : (sheetState.topic || '')) };
    if (id && !o.isFolder) {   // เลิกเป็นโฟลเดอร์ → โน้ตข้างในย้ายออกมาไว้ระดับเดียวกัน
      const kids = noteKids(id);
      kids.forEach(k => Store.update('notes', k.id, { parent, topic: o.topic }));
      if (kids.length) fire('เลิกเป็นโฟลเดอร์แล้ว', `ย้ายโน้ต ${kids.length} รายการออกมาไว้ข้างนอก`);
      if (noteOpen === id) noteOpen = parent || null;
    }
    id ? Store.update(c, id, o) : Store.add(c, o);
  } else if (c === 'homework') {
    if (!v('#f_title')) return warn('ใส่ชื่องานก่อนนะ');
    const o = { title:v('#f_title'), subject:v('#f_subject'), note:v('#f_note'),
                dueAt:new Date(`${$('#f_date').value}T${$('#f_time').value}`).toISOString(), done:id?undefined:false };
    if (o.done===undefined) delete o.done;
    id ? Store.update(c, id, o) : Store.add(c, {...o, done:false});
  } else if (c === 'appts') {
    if (!v('#f_title')) return warn('ใส่ชื่อนัดก่อนนะ');
    const o = { title:v('#f_title'), place:v('#f_place'), note:v('#f_note'), online:sheetState.online, link:v('#f_link'),
                at:new Date(`${$('#f_date').value}T${$('#f_time').value}`).toISOString(), end: $('#f_end') ? $('#f_end').value : '' };
    id ? Store.update(c, id, o) : Store.add(c, o);
  } else if (c === 'exams') {
    if (!v('#f_subject')) return warn('ใส่วิชาที่สอบก่อนนะ');
    const o = { subject:v('#f_subject'), room:v('#f_room'), note:v('#f_note'),
                at:new Date(`${$('#f_date').value}T${$('#f_time').value}`).toISOString() };
    id ? Store.update(c, id, o) : Store.add(c, o);
  } else if (c === 'projects') {
    if (!v('#f_title')) return warn('ใส่ชื่อโปรเจกต์ก่อนนะ');
    const o = { title:v('#f_title'), status:sheetState.status, note:v('#f_note'), color: sheetState.color };
    if (id) Store.update(c, id, o);
    else Store.add(c, {...o, updates:[], ideas:[], createdAt:new Date().toISOString()});
  } else if (c === 'occasions') {
    if (!v('#f_title')) return warn('ใส่ชื่อวันสำคัญก่อนนะ');
    const date = $('#f_date').value; if (!date) return warn('เลือกวันที่ก่อนนะ');
    const o = { title:v('#f_title'), date, repeat: sheetState.occRepeat };
    id ? Store.update(c, id, o) : Store.add(c, o);
  }
  closeSheet();
}

const NKEY = 'planner.notified';
function notified(){ try { return new Set(JSON.parse(localStorage.getItem(NKEY))||[]); } catch { return new Set(); } }
function saveNotified(s){ localStorage.setItem(NKEY, JSON.stringify([...s])); }

/* ===================== ส่งออกลงปฏิทิน (.ics) — เตือนแม้ปิดแอป ===================== */
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsDate(d){ return new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function buildICS(events){
  let s = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//my-planner//TH\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n';
  const stamp = icsDate(new Date());
  events.forEach(e => {
    s += 'BEGIN:VEVENT\r\n';
    s += `UID:${e.uid}\r\nDTSTAMP:${stamp}\r\n`;
    s += `DTSTART:${icsDate(e.start)}\r\nDTEND:${icsDate(e.end)}\r\n`;
    s += `SUMMARY:${icsEsc(e.summary)}\r\n`;
    if (e.desc) s += `DESCRIPTION:${icsEsc(e.desc)}\r\n`;
    if (e.location) s += `LOCATION:${icsEsc(e.location)}\r\n`;
    (e.alarms||[]).forEach(t => { s += `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEsc(e.summary)}\r\nTRIGGER:${t}\r\nEND:VALARM\r\n`; });
    s += 'END:VEVENT\r\n';
  });
  s += 'END:VCALENDAR\r\n';
  return s;
}
function downloadICS(name, text){
  const blob = new Blob([text], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function itemToEvent(type, it){
  if (type==='homework'){ const s=new Date(it.dueAt);
    return { uid:it.id+'@planner', start:s, end:new Date(s.getTime()+30*60000),
      summary:'📚 ส่ง: '+(it.title||''), desc:(it.subject?it.subject+' — ':'')+(it.note||''), location:'', alarms:['-P1D','-PT2H'] }; }
  if (type==='exams'){ const s=new Date(it.at);
    return { uid:it.id+'@planner', start:s, end:new Date(s.getTime()+2*3600000),
      summary:'📝 สอบ: '+(it.subject||''), desc:it.note||'', location:it.room||'', alarms:['-P3D','-P1D','-PT1H'] }; }
  const s=new Date(it.at); // appts
  const eAt = new Date(s); if (it.end) { const [eh, em] = it.end.split(':').map(Number); eAt.setHours(eh, em, 0, 0); }
  return { uid:it.id+'@planner', start:s, end: eAt > s ? eAt : new Date(s.getTime()+3600000),
    summary:'📌 '+(it.title||''), desc:it.note||'', location:it.online?'ออนไลน์':'', alarms:['-P1D','-PT1H'] };
}
function exportItemICS(type, it){
  downloadICS('planner-event.ics', buildICS([itemToEvent(type, it)]));
  fire('สร้างไฟล์ปฏิทินแล้ว', 'เปิดไฟล์ที่ดาวน์โหลดเพื่อเพิ่มลงปฏิทินของเครื่อง');
}
function exportAllICS(){
  const cut = Date.now() - 86400000, evs = [];
  Store.all('homework').filter(h=>!h.done && new Date(h.dueAt)>cut).forEach(h=>evs.push(itemToEvent('homework',h)));
  Store.all('exams').filter(e=>new Date(e.at)>cut).forEach(e=>evs.push(itemToEvent('exams',e)));
  Store.all('appts').filter(a=>new Date(a.at)>cut).forEach(a=>evs.push(itemToEvent('appts',a)));
  if (!evs.length) return warn('ยังไม่มีการบ้าน/นัด/สอบที่จะส่งออก');
  downloadICS('my-planner.ics', buildICS(evs));
  fire(`ส่งออก ${evs.length} รายการแล้ว`, 'เปิดไฟล์ที่ดาวน์โหลด แล้วเพิ่มลงปฏิทินของเครื่อง');
}

async function testNotif(){
  try {
    if (!('Notification' in window)) return warn('เครื่องนี้ไม่รองรับการแจ้งเตือน');
    let perm = Notification.permission;
    if (perm !== 'granted') perm = await Notification.requestPermission();
    refreshBell();
    if (perm !== 'granted') return warn('ยังไม่ได้อนุญาตแจ้งเตือน — กดอนุญาตก่อนนะ');
    // ใช้ service worker แสดง (จำเป็นบน Android Chrome) เผื่อ fallback เป็น Notification ปกติ
    let reg = null;
    try { reg = await navigator.serviceWorker.register('firebase-messaging-sw.js'); await navigator.serviceWorker.ready; } catch(e){}
    closeSheet();
    fire('ตั้งเวลาแล้ว ⏱️', 'จะเด้งใน 10 วินาที — ลองปิดหน้าจอ/สลับแอปรอดูได้ (อย่าปิด Chrome)');
    setTimeout(() => {
      const title = '🔔 ทดสอบแจ้งเตือน';
      const opts = { body: 'ถ้าเห็นข้อความนี้ = แจ้งเตือนบนเครื่องนี้ทำงานปกติ ✓', tag: 'planner-test', renotify: true };
      if (reg && reg.showNotification) reg.showNotification(title, opts);
      else if (window.Notification) { try { new Notification(title, opts); } catch(e){ fire(title, opts.body); } }
    }, 10000);
  } catch (e) {
    console.error(e);
    warn('ทดสอบไม่สำเร็จ: ' + (e?.message || 'ไม่ทราบสาเหตุ'));
  }
}

async function enablePush(){
  try {
    if (!fbReady) return warn('ต้องตั้งค่าซิงค์ก่อน (ปุ่มเมฆ)');
    if (!VAPID_KEY || VAPID_KEY==='PASTE_VAPID_KEY_HERE') return warn('ยังไม่ได้ใส่ VAPID key ในไฟล์');
    if (!('serviceWorker' in navigator)) return warn('เบราว์เซอร์นี้ไม่รองรับ Push');
    const perm = await Notification.requestPermission();
    refreshBell();
    if (perm !== 'granted') return warn('ยังไม่ได้อนุญาตแจ้งเตือน');
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) return warn('ขอ token ไม่สำเร็จ ลองใหม่อีกครั้ง');
    await _db.collection('spaces').doc(getSyncCode()).collection('_pushtokens').doc(token)
      .set({ token, ua: navigator.userAgent.slice(0,140), ts: Date.now() });
    messaging.onMessage(p => { const n=p.notification||{}; fire(n.title||'แจ้งเตือน', n.body||''); });
    closeSheet();
    fire('เปิด Push สำเร็จ ✓', 'เครื่องนี้จะได้รับแจ้งเตือนแม้ปิดแอป');
  } catch (e) {
    console.error(e);
    warn('เปิด Push ไม่สำเร็จ: ' + (e?.message || 'ไม่ทราบสาเหตุ') + ' (iPhone ต้อง Add to Home Screen ก่อน)');
  }
}

function checkDue() {
  const now = Date.now(), seen = notified(), nd = new Date();
  const items = [];
  Store.all('homework').filter(h=>!h.done).forEach(h => items.push({ id:h.id, at:h.dueAt, label:`การบ้าน: ${h.title}`, wins:[[24*3600000,'1วัน','ครบกำหนดพรุ่งนี้'], [3600000,'1ชม','อีก 1 ชั่วโมง'], [300000,'5น','อีก 5 นาที!']] }));
  Store.all('appts').forEach(a => items.push({ id:a.id, at:a.at, label:`นัด: ${a.title}`, wins:[[24*3600000,'1วัน','นัดพรุ่งนี้'], [3600000,'1ชม','อีก 1 ชั่วโมง'], [300000,'5น','อีก 5 นาที!']] }));
  Store.all('exams').forEach(e => items.push({ id:e.id, at:e.at, label:`📝 สอบ: ${e.subject}`, wins:[[7*86400000,'7วัน','สอบในอีก 1 สัปดาห์ เริ่มอ่านได้แล้ว'], [3*86400000,'3วัน','สอบในอีก 3 วัน'], [86400000,'1วัน','สอบพรุ่งนี้!'], [3600000,'1ชม','สอบในอีก 1 ชั่วโมง']] }));
  // วันสำคัญ — 3 วันก่อน + 1 วันก่อน (ช่วงเช้า ~9 โมง)
  Store.all('occasions').forEach(o => {
    const d = nextOccur(o); d.setHours(9,0,0,0);
    items.push({ id:`occ:${o.id}:${ymd(d)}`, at:d.toISOString(), label:`🎉 ${o.title}`,
      wins:[[3*86400000,'3วัน','อีก 3 วัน'], [86400000,'1วัน','พรุ่งนี้แล้ว!']] });
  });

  items.forEach(it => {
    const ms = new Date(it.at) - now;
    it.wins.forEach(([win, tag, word]) => {
      const key = `${it.id}:${tag}`;
      if (ms > 0 && ms <= win && !seen.has(key)) { seen.add(key); notify(it.label, word); }
    });
  });

  // วันสำคัญ — เช้าวันนั้น
  if (nd.getHours() >= 7) Store.all('occasions').forEach(o => {
    if (occursOn(o, nd)) { const key = `occday:${o.id}:${ymd(nd)}`; if (!seen.has(key)) { seen.add(key); notify(`🎉 ${o.title}`, 'วันนี้! 🎉'); } }
  });
  // สิ่งที่ต้องทำภายในสัปดาห์ — เตือนทุกเย็น (18:00) ถ้ายังไม่เสร็จ จนถึงวันครบกำหนด
  if (nd.getHours() >= 18) Store.all('routines').filter(r=>r.countdown && !r.done).forEach(r => {
    const dl = new Date(r.date+'T'+(r.time||'23:59')+':00');
    if (dl < startOfDay(nd)) return;
    const key = `evetask:${r.id}:${ymd(nd)}`;
    if (!seen.has(key)) { const cd = cdText(r.date, r.time); seen.add(key); notify(`⏳ ${r.title}`, `ยังไม่เสร็จ · ${cd.txt}`); }
  });
  saveNotified(seen);
}
function notify(title, body) {
  fire(title, body);
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body, tag:title }); } catch {}
  }
}
function fire(title, body) {
  const t = el('div','toast'); t.innerHTML = `<span class="dot"></span><div><div style="font-weight:600">${esc(title)}</div><div style="opacity:.85;font-size:.82rem">${esc(body)}</div></div>`;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(),400); }, 5000);
}

/* ===================== วนเรนเดอร์ ===================== */
function renderAll() {
  if (curTab==='today') renderToday();
  else if (curTab==='cal') renderCal();
  else if (curTab==='week') renderWeekTab();
  else if (curTab==='class') renderClass();
  else if (curTab==='hw') renderHw();
  else if (curTab==='appt') renderAppt();
  else if (curTab==='proj') renderProj();
  else if (curTab==='note') renderNotes();
}

/* ===================== โหมดมืด ===================== */
function isDark(){
  const a = document.documentElement.getAttribute('data-theme');
  return a ? a === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyThemeIcon(){
  $('#themeIcon').innerHTML = isDark()
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
function toggleTheme(){
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('planner.theme', next); } catch {}
  applyThemeIcon();
}
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyThemeIcon); } catch {}

/* ===================== เริ่มทำงาน ===================== */
$('#todayLabel').textContent = fmtDate(new Date());
$('#sideDate').textContent = `${TH_DAY[new Date().getDay()]} ${new Date().getDate()} ${TH_MON_FULL[new Date().getMonth()]} ${new Date().getFullYear()+543}`;
buildTabs();
applyViewWidth(curTab);
const quickAdd = () => openSheet(curTab==='class'?'classes':curTab==='hw'?'homework':curTab==='proj'?'projects':curTab==='note'?'notes':(curTab==='appt'||curTab==='cal'||curTab==='week')?'appts':'homework', null);
$('#fab').onclick = quickAdd;
$('#addBtn').onclick = quickAdd;
$('#scrim').onclick = closeSheet;
document.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  if (e.target.closest('button, a, input, textarea, select, .ck-item')) return;
  const ed = card.querySelector(':scope > .row-actions .icon-btn'); if (ed) ed.click();
});
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  if ($('#sheet').classList.contains('show')) return;
  e.preventDefault(); if (curTab !== 'today') switchTab('today');
  const q = $('#quickIn'); if (q) q.focus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('show') && !$('#dialog').classList.contains('show')) closeSheet(); });
$('#bellBtn').onclick = openNotifSheet;
$('#enableNotif').onclick = askNotif;
$('#syncBtn').onclick = openSyncSheet;
$('#themeBtn').onclick = toggleTheme;
applyThemeIcon();
if (Store.__cloud) $('#syncBtn').classList.add('synced');

Store.subscribe(renderAll);
refreshBell();
checkDue();
setInterval(() => { checkDue(); if (curTab==='today') renderToday(); }, 60000); // อัปเดตนับถอยหลัง + ตรวจเตือนทุกนาที
</script>
</body>
</html>
