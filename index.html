<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ตารางของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Mitr:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Layout: มือถือ = คอลัมน์เดียว หัวติดบน + แถบล่าง 5 ปุ่ม + ปุ่ม + ลอย
     คอม ≥900px = เมนูด้านข้างครบทุกหน้า เนื้อหากว้างขึ้น หน้าวันนี้/ปฏิทินแบ่ง 2 คอลัมน์ แผ่นกรอกกลายเป็นกล่องกลางจอ */
  :root {
    --paper: #F2F5F5; --card: #FFFFFF; --field: #EAEFF0; --card-edge: #E6ECED;
    --ink: #15202A; --ink-soft: #5B6772; --ink-faint: #97A1A9;
    --line: #E2E8E9; --line-strong: #CED7D9;
    --primary: #0E9488; --primary-deep: #0A6F66; --teal-soft: #DBF0EC; --on-primary: #FFFFFF;
    --soon: #DB8C0C; --soon-ink: #935A03; --amber-soft: #FBEFD5;
    --over: #D5434B; --over-soft: #FBE4E5;
    --routine: #7366DA; --routine-soft: #ECEAFB;
    --exam: #D9436F; --exam-soft: #FBE3EA; --exam-a: #CF3569; --exam-b: #A8285A; --on-exam: #FFFFFF;
    --c-hw: #1D9961; --c-appt: #DB8C0C; --c-todo: #66737E;
    --online: #3461D4; --online-soft: #E3EBFB;
    --danger: #D5434B;
    --invert-bg: #15202A; --invert-fg: #FFFFFF; --invert-fg-soft: rgba(255,255,255,.68);
    --nav-bg: rgba(242,245,245,.86); --scrim: rgba(21,32,42,.34);
    --radius: 18px;
    --shadow: 0 1px 2px rgba(21,32,42,.04), 0 6px 18px rgba(21,32,42,.05);
    --shadow-lift: 0 18px 48px rgba(21,32,42,.18);
    --font: "Anuphan", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Mitr", "Anuphan", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #0F1417; --card: #192025; --field: #222A30; --card-edge: #242D34;
    --ink: #E6EBED; --ink-soft: #99A5AD; --ink-faint: #67737B;
    --line: #253038; --line-strong: #34414A;
    --primary: #2CC6B2; --primary-deep: #62DACA; --teal-soft: #15312E; --on-primary: #06201C;
    --soon: #F0AE3C; --soon-ink: #F2B54D; --amber-soft: #382B12;
    --over: #F07980; --over-soft: #3A1D20;
    --routine: #A89BF4; --routine-soft: #282548;
    --exam: #F37D9D; --exam-soft: #3C1F2A; --exam-a: #B92F5E; --exam-b: #8A2150; --on-exam: #FFFFFF;
    --c-hw: #4CC88D; --c-appt: #F0AE3C; --c-todo: #93A0AA;
    --online: #8EAFF5; --online-soft: #1D2944;
    --danger: #F07980;
    --invert-bg: #E6EBED; --invert-fg: #0F1417; --invert-fg-soft: rgba(15,20,23,.62);
    --nav-bg: rgba(15,20,23,.86); --scrim: rgba(0,0,0,.5);
    --shadow: 0 1px 2px rgba(0,0,0,.28), 0 6px 18px rgba(0,0,0,.22);
    --shadow-lift: 0 18px 48px rgba(0,0,0,.5);
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --paper: #0F1417; --card: #192025; --field: #222A30; --card-edge: #242D34;
    --ink: #E6EBED; --ink-soft: #99A5AD; --ink-faint: #67737B;
    --line: #253038; --line-strong: #34414A;
    --primary: #2CC6B2; --primary-deep: #62DACA; --teal-soft: #15312E; --on-primary: #06201C;
    --soon: #F0AE3C; --soon-ink: #F2B54D; --amber-soft: #382B12;
    --over: #F07980; --over-soft: #3A1D20;
    --routine: #A89BF4; --routine-soft: #282548;
    --exam: #F37D9D; --exam-soft: #3C1F2A; --exam-a: #B92F5E; --exam-b: #8A2150; --on-exam: #FFFFFF;
    --c-hw: #4CC88D; --c-appt: #F0AE3C; --c-todo: #93A0AA;
    --online: #8EAFF5; --online-soft: #1D2944;
    --danger: #F07980;
    --invert-bg: #E6EBED; --invert-fg: #0F1417; --invert-fg-soft: rgba(15,20,23,.62);
    --nav-bg: rgba(15,20,23,.86); --scrim: rgba(0,0,0,.5);
    --shadow: 0 1px 2px rgba(0,0,0,.28), 0 6px 18px rgba(0,0,0,.22);
    --shadow-lift: 0 18px 48px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  html { background: var(--paper); transition: background .2s; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: var(--font); }
  body { -webkit-font-smoothing: antialiased; line-height: 1.5; font-size: 15px; }
  button, input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .hidden { display: none; }

  /* ---------- โครงหน้า ---------- */
  .side { display: none; }
  .app { max-width: 720px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
         padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; padding: 16px 18px 12px;
               display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
               background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .hdr-text { min-width: 0; }
  header.top .when { font-size: .8rem; color: var(--ink-soft); font-weight: 500; }
  header.top h1 { font-family: var(--display); font-weight: 500; font-size: 1.7rem; line-height: 1.2; text-wrap: balance; }
  .hdr-actions { display: flex; gap: 6px; flex: none; align-items: center; }
  .bell { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--card); color: var(--ink-soft);
          display: grid; place-items: center; flex: none; box-shadow: var(--shadow); transition: background .15s, color .15s; }
  .bell:hover { color: var(--ink); }
  .bell svg { width: 19px; height: 19px; }
  .bell.on, .bell.synced { background: var(--teal-soft); color: var(--primary-deep); }
  .add-btn { display: none; align-items: center; gap: 6px; height: 40px; padding: 0 18px 0 13px; border-radius: 20px; border: none;
             background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: .92rem; margin-left: 6px; }
  .add-btn svg { width: 18px; height: 18px; }
  .sync-note { font-size: .88rem; color: var(--ink-soft); margin: 8px 0 4px; line-height: 1.55; }
  .sync-ok { background: var(--teal-soft); color: var(--primary-deep); border-radius: 12px; padding: 11px 14px;
             font-size: .88rem; font-weight: 600; margin: 8px 0; }

  main { flex: 1; padding: 6px 16px 24px; }
  .view { display: none; animation: fade .25s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- หัวกลุ่ม ---------- */
  .eyebrow { font-size: .98rem; font-weight: 600; color: var(--ink); margin: 26px 4px 10px; display: flex; align-items: center; gap: 8px;
             scroll-margin-top: 96px; }
  .eyebrow:first-child { margin-top: 8px; }
  .eyebrow .count { background: var(--field); color: var(--ink-soft); font-size: .72rem; font-weight: 600; padding: 1px 8px;
                    border-radius: 20px; font-variant-numeric: tabular-nums; }

  /* ---------- สรุปวันนี้ ---------- */
  .now-card { --nc: var(--primary); background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
              border: 1px solid var(--card-edge); padding: 16px 18px; margin: 4px 0 12px; }
  .now-card .nc-lbl { font-size: .78rem; font-weight: 600; color: color-mix(in srgb, var(--nc) 78%, var(--ink)); }
  .now-card .nc-sub { font-family: var(--display); font-weight: 500; font-size: 1.45rem; line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; }
  .now-card .nc-meta { font-size: .86rem; color: var(--ink-soft); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .now-card .nc-bar { height: 6px; border-radius: 6px; background: var(--field); margin-top: 12px; overflow: hidden; }
  .now-card .nc-bar i { display: block; height: 100%; border-radius: inherit; background: var(--nc); }
  .now-card .nc-next { font-size: .84rem; color: var(--ink-soft); margin-top: 10px; }
  .now-card .nc-next b { color: var(--ink); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stat { border: none; background: var(--field); border-radius: 14px; padding: 10px 12px; text-align: left; color: var(--ink); min-width: 0; }
  .stat b { display: block; font-family: var(--display); font-weight: 500; font-size: 1.45rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { display: block; font-size: .74rem; color: var(--ink-soft); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.alert { background: var(--over-soft); }
  .stat.alert b { color: var(--over); }

  /* ---------- การ์ด ---------- */
  .card { background: var(--card); border: 1px solid var(--card-edge); border-radius: var(--radius); box-shadow: var(--shadow);
          padding: 13px 15px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .card .accent { width: 4px; align-self: stretch; border-radius: 4px; flex: none; background: var(--line-strong); }
  .kind-tile { --c: var(--primary); width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center;
               background: color-mix(in srgb, var(--c) 15%, var(--card)); color: color-mix(in srgb, var(--c) 85%, var(--ink)); }
  .kind-tile svg { width: 19px; height: 19px; }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-weight: 600; font-size: 1rem; line-height: 1.4; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; overflow-wrap: anywhere; }
  .card .meta { font-size: .84rem; color: var(--ink-soft); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px 12px; }
  .card .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .card.done { opacity: .72; }
  .card.done .title { text-decoration: line-through; color: var(--ink-soft); }
  .card .note-line { font-size: .78rem; color: var(--ink-soft); margin-top: 5px; white-space: pre-wrap; padding-left: 9px; border-left: 2px solid var(--line); }
  .card a.note-link, .note-card a.note-link { color: var(--primary-deep); font-weight: 600; text-decoration: none;
                                              border-bottom: 1.5px solid var(--teal-soft); word-break: break-all; }
  .card.overdue { box-shadow: inset 3px 0 0 var(--over), var(--shadow); }
  .card.prio { box-shadow: inset 3px 0 0 var(--soon), var(--shadow); }
  .card .prio-badge { display: inline-block; background: var(--soon); color: var(--on-primary); font-size: .62rem; font-weight: 700;
                      padding: 2px 7px; border-radius: 7px; margin-left: 6px; vertical-align: middle; }
  /* คาบเรียน: เวลาอยู่ซ้าย แถบสีวิชา */
  .card.class-card { --c: var(--primary); align-items: stretch; background: color-mix(in srgb, var(--c) 6%, var(--card)); }
  .class-card .tcol { width: 46px; flex: none; display: flex; flex-direction: column; justify-content: center; font-variant-numeric: tabular-nums; }
  .class-card .tcol b { font-size: .92rem; font-weight: 600; }
  .class-card .tcol span { font-size: .78rem; color: var(--ink-soft); }
  .class-card .body { border-left: 3px solid var(--c); padding-left: 12px; display: flex; flex-direction: column; justify-content: center; min-height: 40px; }
  .class-card .title { color: color-mix(in srgb, var(--c) 55%, var(--ink)); }
  .class-card.past { opacity: .55; }
  .class-card.now { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, transparent), var(--shadow); }
  .class-card .row-actions { align-self: center; }

  .hw-item { margin-bottom: 10px; }
  .hw-item .card { margin-bottom: 0; touch-action: pan-y; }
  .hw-item .card.swiped { box-shadow: inset 3px 0 0 var(--primary), var(--shadow); }
  .reorder-bar { display: flex; gap: 8px; padding: 8px 2px 2px; }
  .reorder-bar.hidden { display: none; }
  .reorder-bar button { flex: 1; border: none; background: var(--field); color: var(--ink); border-radius: 11px; padding: 10px; font-size: .82rem; font-weight: 600; }
  .reorder-bar button:active { color: var(--primary-deep); }
  .see-all { display: block; margin: 4px 0 2px auto; padding: 6px 4px; background: none; border: none;
             color: var(--primary-deep); font-size: .82rem; font-weight: 600; }
  .agenda { display: flex; flex-direction: column; gap: 6px; }
  .ag-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--card); border: 1px solid var(--card-edge);
            border-radius: 14px; cursor: pointer; }
  .ag-row:hover { background: color-mix(in srgb, var(--field) 50%, var(--card)); }
  .ag-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .ag-mid { flex: 1; min-width: 0; }
  .ag-t { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-s { font-size: .74rem; color: var(--ink-soft); margin-top: 1px; }
  .ag-c { flex: none; font-size: .76rem; font-weight: 600; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
  .ag-c.soon { color: var(--exam); }
  /* เช็กลิสต์ */
  .ck-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .ck-row .ck-text { flex: 1; }
  .ck-del { flex: none; width: 40px; border: none; background: var(--field); color: var(--ink-soft); border-radius: 11px; font-size: .85rem; }
  .ck-add { background: none; border: 1.5px dashed var(--line-strong); color: var(--ink-soft); width: 100%; padding: 10px;
            border-radius: 12px; font-size: .86rem; font-weight: 600; margin-top: 2px; }
  .ck-add:hover { border-color: var(--primary); color: var(--primary-deep); }
  .card .ck-list { margin-top: 8px; }
  .card .ck-prog { font-size: .72rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; }
  .card .ck-item { display: flex; align-items: center; gap: 9px; padding: 3px 0; cursor: pointer; font-size: .86rem; }
  .card .ck-box { flex: none; width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 6px;
                  display: inline-flex; align-items: center; justify-content: center; }
  .card .ck-box svg { width: 12px; height: 12px; stroke: var(--on-primary); }
  .card .ck-item.on .ck-box { background: var(--primary); border-color: var(--primary); }
  .card .ck-item.on .ck-txt { text-decoration: line-through; color: var(--ink-soft); }

  /* ป้ายนับถอยหลัง */
  .pill { font-size: .74rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap;
          background: var(--teal-soft); color: var(--primary-deep); font-variant-numeric: tabular-nums; }
  .pill.soon { background: var(--amber-soft); color: var(--soon-ink); }
  .pill.over { background: var(--over-soft); color: var(--over); }
  .pill.online { background: var(--online-soft); color: var(--online); }
  .pill.exam { background: var(--exam-soft); color: var(--exam); }
  .pill.now { background: color-mix(in srgb, var(--c) 16%, var(--card)); color: color-mix(in srgb, var(--c) 75%, var(--ink)); }
  .card .meta a.link { color: var(--primary-deep); font-weight: 600; text-decoration: none; border-bottom: 1.5px solid var(--teal-soft); }

  /* สวิตช์ */
  .toggle-row, label.fld.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toggle-row > span { margin-bottom: 0; }
  .switch { width: 48px; height: 28px; border-radius: 20px; border: none; background: var(--line-strong);
            position: relative; transition: background .18s; flex: none; padding: 0; }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
                  background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .18s; }
  .switch.on { background: var(--primary); } .switch.on .knob { transform: translateX(20px); }

  /* ปฏิทินรายเดือน */
  .cal-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 12px; }
  .cal-head .mo { font-family: var(--display); font-weight: 500; font-size: 1.25rem; flex: 1; min-width: 0; }
  .cal-head button { border: none; background: var(--card); box-shadow: var(--shadow); border-radius: 50%;
                     width: 38px; height: 38px; flex: none; display: grid; place-items: center; color: var(--ink); }
  .cal-head .today-btn { width: auto; border-radius: 20px; padding: 0 15px; font-size: .84rem; font-weight: 600; color: var(--primary-deep); }
  .cal-head svg { width: 18px; height: 18px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--card);
              border: 1px solid var(--card-edge); border-radius: 20px; padding: 10px 8px 8px; box-shadow: var(--shadow); }
  .cal-dow { text-align: center; font-size: .72rem; font-weight: 600; color: var(--ink-faint); padding: 2px 0 8px; }
  .cal-cell { aspect-ratio: 1; max-width: 100%; border-radius: 12px; display: flex; flex-direction: column; align-items: center;
              justify-content: flex-start; padding-top: 4px; gap: 3px; cursor: pointer; }
  .cal-cell .dn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .88rem;
                  font-weight: 500; font-variant-numeric: tabular-nums; transition: background .12s; }
  .cal-cell:hover .dn { background: var(--field); }
  .cal-cell.dim .dn { color: var(--ink-faint); }
  .cal-cell.today .dn { color: var(--primary-deep); box-shadow: inset 0 0 0 1.5px var(--primary); font-weight: 700; }
  .cal-cell.sel .dn { background: var(--invert-bg); color: var(--invert-fg); box-shadow: none; }
  .cal-dots { display: flex; gap: 3px; }
  .cal-dots i { width: 5px; height: 5px; border-radius: 50%; }
  .cal-dots i.hw { background: var(--c-hw); } .cal-dots i.ap { background: var(--c-appt); } .cal-dots i.oc { background: var(--routine); }
  .cal-dots i.rt { background: var(--c-todo); } .cal-dots i.ex { background: var(--exam); }
  .cal-dots i.rtw { background: transparent; box-shadow: inset 0 0 0 1.3px var(--c-todo); }
  .cal-day-head { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 22px 4px 10px; }
  .cal-add { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .cal-add button { flex: 1 1 auto; border: 1.5px dashed var(--line-strong); background: transparent; border-radius: 12px;
                    padding: 10px 12px; font-size: .84rem; font-weight: 600; color: var(--ink-soft); }
  .cal-add button:hover { border-color: var(--primary); color: var(--primary-deep); }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin: 0 0 12px; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; color: var(--ink-soft); }
  .cal-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent;
           flex: none; display: grid; place-items: center; transition: .15s; margin-top: 1px; }
  .check:hover { border-color: var(--primary); }
  .check.tick { background: var(--primary); border-color: var(--primary); }
  .check svg { width: 13px; height: 13px; color: var(--on-primary); opacity: 0; transition: .15s; }
  .check.tick svg { opacity: 1; }

  .row-actions { display: flex; gap: 2px; flex: none; }
  /* แตะการ์ดเพื่อแก้ไข — มือถือซ่อนปุ่มดินสอ/ถังขยะ (ลบได้ในหน้าแก้ไข), คอมโชว์ตอนชี้ */
  .card:has(> .row-actions) { cursor: pointer; }
  @media (hover: none) { .card > .row-actions { display: none; } }
  @media (hover: hover) { .card > .row-actions { opacity: 0; transition: opacity .15s; }
                          .card:hover > .row-actions, .card:focus-within > .row-actions { opacity: 1; } }
  .icon-btn { width: 32px; height: 32px; border-radius: 10px; border: none; background: transparent; color: var(--ink-faint);
              display: grid; place-items: center; }
  .icon-btn:hover { background: var(--field); color: var(--ink); }
  .icon-btn svg { width: 17px; height: 17px; }

  .empty { text-align: center; color: var(--ink-soft); padding: 34px 20px; }
  .empty .em { font-size: 1.6rem; margin-bottom: 6px; }

  /* ตารางเรียน — แถบวัน */
  .daybar { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 14px; -webkit-overflow-scrolling: touch; }
  .daybar button { border: none; background: var(--card); box-shadow: var(--shadow); border-radius: 14px;
                   padding: 8px 6px; min-width: 48px; flex: 1 0 auto; text-align: center; transition: .15s; }
  .daybar button .d { font-size: .74rem; color: var(--ink-soft); font-weight: 500; }
  .daybar button .n { font-weight: 600; font-size: 1rem; min-height: 1.45em; font-variant-numeric: tabular-nums; }
  .daybar button.sel { background: var(--invert-bg); color: var(--invert-fg); }
  .daybar button.sel .d { color: var(--invert-fg-soft); }

  /* ---------- แถบล่าง (มือถือ) ---------- */
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--nav-bg);
             backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);

  nav.tabs .inner { max-width: 560px; margin: 0 auto; width: 100%; display: flex; }
  nav.tabs button { flex: 1; min-width: 0; background: none; border: none; padding: 3px 0; display: flex; flex-direction: column;
                    align-items: center; gap: 3px; color: var(--ink-soft); }
  nav.tabs .ic { width: 46px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .18s; }
  nav.tabs svg { width: 21px; height: 21px; }
  nav.tabs .lb { font-size: .66rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  nav.tabs button.active { color: var(--primary-deep); }
  nav.tabs button.active .ic { background: var(--teal-soft); }
  nav.tabs button.active .lb { font-weight: 600; }
  .more-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .more-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--card-edge);
              border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); color: var(--ink); }
  .more-row .mr-ic { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
                     background: var(--teal-soft); color: var(--primary-deep); }
  .more-row .mr-ic svg { width: 20px; height: 20px; }
  .more-row .mr-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .more-row .mr-txt b { font-size: .98rem; font-weight: 600; }
  .more-row .mr-txt span { font-size: .78rem; color: var(--ink-soft); }
  .more-row .mr-chev { flex: none; color: var(--ink-faint); font-size: 1.4rem; line-height: 1; }
  .more-row.on { box-shadow: inset 0 0 0 1.5px var(--primary), var(--shadow); }

  /* ---------- เพิ่มเร็วด้วยประโยคเดียว ---------- */
  .quick { background: var(--card); border: 1.5px solid var(--card-edge); border-radius: 18px; box-shadow: var(--shadow); margin: 2px 0 14px; transition: border-color .15s; }
  .quick:focus-within, .quick.open { border-color: var(--primary); }
  .q-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 6px 6px 14px; }
  .q-ic { flex: none; display: grid; color: var(--primary-deep); padding-top: 11px; }
  .q-ic svg { width: 18px; height: 18px; }
  .q-in { flex: 1; min-width: 0; border: none; background: none; padding: 9px 2px; font-size: .98rem; line-height: 1.5; resize: none; overflow-y: auto; max-height: 150px; }
  .q-in:focus, .q-in:focus-visible { outline: none; }
  .q-in::placeholder { color: var(--ink-faint); }
  .q-kbd { flex: none; margin-top: 10px; font: 600 .74rem var(--font); color: var(--ink-faint); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 7px; }
  .quick.open .q-kbd, .quick:focus-within .q-kbd { display: none; }
  @media (hover: none) { .q-kbd { display: none; } }
  .q-help { flex: none; width: 36px; height: 36px; margin-top: 2px; border-radius: 50%; border: none; background: var(--field); color: var(--ink-soft); font-weight: 700; font-size: .9rem; }
  .q-help:hover { color: var(--ink); }
  .q-add { flex: none; margin-top: 2px; border: none; background: var(--primary); color: var(--on-primary); border-radius: 12px; padding: 9px 16px; font-weight: 600; font-size: .88rem; white-space: nowrap; }
  .q-add:disabled { background: var(--field); color: var(--ink-faint); cursor: default; }
  .q-prev { border-top: 1px solid var(--line); padding: 12px 14px; }
  .q-prev:empty { display: none; }
  .q-read { font-size: .82rem; color: var(--ink-soft); line-height: 2; margin-bottom: 8px; overflow-wrap: anywhere; }
  .q-read-lb { font-size: .7rem; font-weight: 600; color: var(--ink-faint); margin-right: 6px; }
  .q-read mark { border-radius: 6px; padding: 1px 5px; margin: 0 1px; font-weight: 600; color: var(--ink); background: var(--field); }
  .q-read mark.h-date, .q-read mark.h-days { background: var(--teal-soft); color: var(--primary-deep); }
  .q-read mark.h-time { background: var(--amber-soft); color: var(--soon-ink); }
  .q-read mark.h-subject { background: color-mix(in srgb, var(--c-hw) 16%, var(--card)); color: color-mix(in srgb, var(--c-hw) 72%, var(--ink)); }
  .q-read mark.h-repeat { background: var(--routine-soft); color: var(--routine); }
  .q-read mark.h-place, .q-read mark.h-room, .q-read mark.h-link { background: var(--online-soft); color: var(--online); }
  .q-card { display: flex; gap: 12px; align-items: flex-start; }
  .q-main { flex: 1; min-width: 0; }
  .q-kind { font-size: .72rem; font-weight: 600; color: var(--ink-soft); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .q-tag { background: var(--routine-soft); color: var(--routine); border-radius: 10px; padding: 0 8px; font-size: .66rem; }
  .q-title { display: inline; text-align: left; border: none; background: none; padding: 0; font-weight: 600; font-size: 1rem; line-height: 1.45;
             color: var(--ink); overflow-wrap: anywhere; border-bottom: 1.5px dashed var(--line-strong); }
  .q-title:hover { border-bottom-color: var(--primary); }
  .q-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .q-chip { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 4px 10px; font-size: .8rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .q-chip:hover { border-color: var(--primary); }
  .q-chip.on { border-color: var(--primary); background: var(--teal-soft); color: var(--primary-deep); }
  .q-chip.empty { border-style: dashed; color: var(--ink-soft); }
  .q-chip.static { cursor: default; background: var(--online-soft); color: var(--online); border-color: transparent; }
  .q-hint { font-size: .76rem; color: var(--soon-ink); margin-top: 6px; }
  .q-form { flex: none; border: none; background: var(--field); color: var(--ink-soft); border-radius: 10px; padding: 6px 10px; font-size: .76rem; font-weight: 600; }
  .q-form:hover { color: var(--ink); }
  .q-ed { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; padding: 12px; background: var(--paper); border-radius: 14px; }
  .q-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .q-f > span { font-size: .74rem; font-weight: 600; color: var(--ink-soft); }
  .q-f .inp { padding: 9px 11px; font-size: .92rem; }
  .q-f-wide { grid-column: 1 / -1; }
  .q-days { gap: 4px; }
  .q-days button { width: 38px; height: 34px; }
  .q-learn { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .8rem; color: var(--ink-soft); }
  .q-learn .inp { width: 7.5em; padding: 5px 8px; font-size: .84rem; }
  .q-ed-foot { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
  .q-ed-done { border: none; background: var(--primary); color: var(--on-primary); border-radius: 10px; padding: 7px 16px; font-weight: 600; font-size: .84rem; }
  .q-kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .q-kinds button { border: none; background: var(--field); color: var(--ink-soft); border-radius: 20px; padding: 5px 11px; font-size: .76rem; font-weight: 600; }
  .q-kinds button.on { background: var(--invert-bg); color: var(--invert-fg); }
  .q-learn-note { font-size: .74rem; color: var(--routine); margin-top: 8px; }
  .q-foot { font-size: .72rem; color: var(--ink-faint); margin-top: 10px; }
  .q-mhead { font-size: .84rem; color: var(--ink-soft); margin-bottom: 8px; }
  .q-mhead b { color: var(--ink); }
  .q-list { display: flex; flex-direction: column; gap: 6px; }
  .q-hdr { font-size: .76rem; color: var(--ink-faint); padding: 2px 4px; overflow-wrap: anywhere; }
  .q-hdr span { font-size: .66rem; font-weight: 600; background: var(--field); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
  .q-it { border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .q-it.open { border-color: var(--primary); }
  .q-it.off .q-it-row > :not(.q-tick) { opacity: .45; }
  .q-it-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  .q-tick { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent; display: grid; place-items: center; padding: 0; }
  .q-tick svg { width: 13px; height: 13px; color: var(--on-primary); opacity: 0; }
  .q-tick.on { background: var(--primary); border-color: var(--primary); }

  .kind-tile.sm { width: 30px; height: 30px; border-radius: 9px; }
  .kind-tile.sm svg { width: 16px; height: 16px; }
  .q-it-main { flex: 1; min-width: 0; border: none; background: none; text-align: left; padding: 0; color: var(--ink); display: flex; flex-direction: column; }
  .q-it-main b { font-weight: 600; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-it-main span { font-size: .76rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--soon); flex: none; }
  .q-chev { flex: none; border: none; background: none; color: var(--ink-faint); font-size: .9rem; width: 28px; height: 28px; border-radius: 8px; }
  .q-chev:hover { background: var(--field); color: var(--ink); }
  .q-it-body { padding: 2px 12px 12px; }
  .sheet .quick { margin: 12px 0 4px; box-shadow: none; }
  .q-or { font-size: .78rem; color: var(--ink-faint); text-align: center; margin: 10px 0 -6px; }
  .toast .t-txt { flex: 1; min-width: 0; }
  .toast-act { pointer-events: auto; flex: none; background: transparent; color: var(--invert-fg); border: 1px solid var(--invert-fg-soft);
               border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: .82rem; }
  .q-exs { display: flex; flex-direction: column; gap: 6px; }
  .q-ex { text-align: left; border: 1px solid var(--card-edge); background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: .88rem; color: var(--ink); line-height: 1.55; }
  .q-ex:hover { border-color: var(--primary); }
  .q-learned { display: flex; flex-direction: column; gap: 4px; }
  .q-lr { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--card-edge); border-radius: 12px; padding: 4px 4px 4px 12px; font-size: .86rem; }
  .q-lr span { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  /* ---------- โน้ต ---------- */
  .note-card .note-body { white-space: pre-wrap; font-size: .9rem; margin-top: 5px; line-height: 1.55; overflow-wrap: anywhere; }
  .note-card .title { white-space: pre-wrap; }
  .note-card .note-head { font-weight: 700; font-size: .9rem; margin-top: 10px; }
  .note-card .note-tag { font-size: .72rem; color: var(--ink-soft); margin-top: 7px; font-weight: 500; }
  .sec-row { display: flex; flex-direction: column; gap: 5px; padding: 8px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; }
  .sec-row .sec-del { align-self: flex-start; background: none; border: none; color: var(--exam); font-size: .74rem; padding: 0; }

  /* ช่องค้นหา */
  .search { position: relative; margin: 0 0 12px; }
  .search input { width: 100%; border: 1.5px solid transparent; background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
                  padding: 11px 40px; font-size: .95rem; -webkit-appearance: none; appearance: none; }
  .search input:focus { border-color: var(--primary); outline: none; }
  .search input::placeholder { color: var(--ink-faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px;
                color: var(--ink-faint); pointer-events: none; }
  .search .s-clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px;
                     border: none; background: none; color: var(--ink-soft); border-radius: 10px; font-size: .85rem; }
  .search .s-clear:hover { background: var(--field); color: var(--ink); }
  .search .s-clear.hidden { display: none; }
  .search-count { font-size: .78rem; color: var(--ink-soft); font-weight: 600; margin: 0 4px 8px; }
  .search-count:empty { display: none; }
  /* หัวข้อ */
  .topics { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 14px; -webkit-overflow-scrolling: touch; }
  .topics button { flex: none; border: none; background: var(--card); box-shadow: var(--shadow); border-radius: 20px;
                   padding: 7px 14px; font-size: .84rem; font-weight: 600; color: var(--ink-soft);
                   display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .topics button .fc { font-size: .72rem; font-weight: 500; opacity: .7; font-variant-numeric: tabular-nums; }
  .topics button.on { background: var(--invert-bg); color: var(--invert-fg); }
  .topics .t-add { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
  .topics .t-add:hover { box-shadow: inset 0 0 0 1.5px var(--primary); color: var(--primary-deep); }
  .topic-head { display: flex; align-items: center; gap: 10px; margin: 0 4px 10px; }
  .topic-head .th-name { flex: 1; min-width: 0; font-family: var(--display); font-weight: 500; font-size: 1.15rem;
                         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topic-head .th-edit { flex: none; border: none; background: var(--field); color: var(--ink-soft);
                         border-radius: 10px; padding: 7px 12px; font-size: .78rem; font-weight: 600; }
  /* โน้ตแบบโฟลเดอร์ */
  .note-card.note-folder { cursor: pointer; align-items: center; }
  .note-card.note-folder:hover { border-color: var(--line-strong); }
  .note-folder .nf-chev { flex: none; color: var(--ink-faint); font-size: 1.5rem; line-height: 1; padding: 0 2px; }
  .nf-back { display: block; max-width: 100%; border: none; background: none; color: var(--primary-deep); font-weight: 600;
             font-size: .92rem; padding: 2px 2px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.nf-page { display: block; padding: 18px 20px; margin-bottom: 6px; }
  .nf-page .nf-kicker { font-size: .74rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 2px; }
  .nf-page .nf-h { display: flex; align-items: flex-start; gap: 8px; }
  .nf-page .nf-title { flex: 1; min-width: 0; font-family: var(--display); font-size: 1.35rem; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  .nf-page .note-body { font-size: .96rem; line-height: 1.7; margin-top: 12px; }
  .nf-empty { font-size: .86rem; color: var(--ink-soft); padding: 10px 4px; }
  .nf-page .nf-empty { padding: 8px 0 0; }
  .nf-add { margin: 2px 0 8px; }
  .fld-hint { font-size: .78rem; color: var(--ink-soft); margin: 6px 2px 0; line-height: 1.5; }

  /* วันสอบ */
  .exam-hero { display: flex; gap: 16px; align-items: center; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; cursor: pointer;
               background: linear-gradient(135deg, var(--exam-a), var(--exam-b)); color: var(--on-exam);
               box-shadow: 0 10px 26px color-mix(in srgb, var(--exam-a) 32%, transparent); }
  .exam-hero .eh-days { flex: none; min-width: 64px; text-align: center; font-family: var(--display); line-height: 1; }
  .exam-hero .eh-days b { display: block; font-size: 2.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .exam-hero .eh-days.word b { font-size: 1.35rem; }
  .exam-hero .eh-days span { font-family: var(--font); font-size: .8rem; font-weight: 600; opacity: .9; }
  .exam-hero .eh-body { min-width: 0; padding-left: 16px; border-left: 1.5px solid rgba(255,255,255,.35); }
  .exam-hero .lbl { font-size: .76rem; font-weight: 600; letter-spacing: .02em; opacity: .92; display: flex; align-items: center; gap: 7px; }
  .exam-hero .sub { font-family: var(--display); font-weight: 500; font-size: 1.3rem; line-height: 1.3; margin-top: 2px; overflow-wrap: anywhere; }
  .exam-hero .cd { font-size: .86rem; margin-top: 3px; opacity: .92; }

  .exam-hero.past { background: var(--exam-soft); color: var(--ink); box-shadow: none; }

  .exam-hero.past .cd { color: var(--ink-soft); }

  /* ตารางทั้งสัปดาห์ (กริด) */
  .view-seg { display: flex; gap: 4px; background: var(--field); padding: 4px; border-radius: 14px; margin: 0 0 14px; }
  .view-seg button { flex: 1; border: none; background: none; padding: 9px; border-radius: 10px; font-size: .86rem;
                     font-weight: 600; color: var(--ink-soft); }
  .view-seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .week-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
  .weekT, .weekV { display: grid; position: relative; height: 100%; }
  .wkgrid .blk { --c: var(--primary); position: absolute; border-radius: 8px; padding: 3px 6px; overflow: hidden; cursor: pointer;
                 font-size: .66rem; line-height: 1.2; display: flex; flex-direction: column; justify-content: center; color: var(--ink);
                 background: color-mix(in srgb, var(--c) 17%, var(--card)); box-shadow: inset 3px 0 0 var(--c); }
  .wkgrid .blk:hover { background: color-mix(in srgb, var(--c) 26%, var(--card)); }
  .wkgrid .blk b { font-weight: 600; color: color-mix(in srgb, var(--c) 62%, var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wkgrid .blk small { color: var(--ink-soft); font-size: .6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* คงสีวิชาเดิมไว้ แล้วใส่กรอบชมพูหนา 3px + เงาชมพู + แถบสีวิชาด้านซ้าย */
  .wkgrid .blk.has-exam { box-shadow: inset 0 0 0 3px var(--exam), inset 8px 0 0 var(--c), 0 3px 10px color-mix(in srgb, var(--exam) 38%, transparent); z-index: 2; }
  .wkgrid .blk.is-exam { background: color-mix(in srgb, var(--exam) 16%, var(--card));
                         box-shadow: inset 0 0 0 3px var(--exam), 0 3px 10px color-mix(in srgb, var(--exam) 38%, transparent); z-index: 2; }
  .wkgrid .blk.is-exam b { color: var(--exam); }
  .wkgrid .blk.has-exam { padding-left: 11px; }
  .wkgrid .blk.is-exam { padding-left: 8px; }
  .wkgrid .blk .exam-tag { background: linear-gradient(135deg, var(--exam-a), var(--exam-b)); color: var(--on-exam); font-size: .58rem; font-weight: 700;
                           padding: 1px 6px; border-radius: 5px; align-self: flex-start; margin-top: 2px; white-space: nowrap; }
  .weekT .th { position: relative; }
  .weekT .th span:last-child:not(:first-child) { transform: translateX(-100%); }
  .weekT .th span { position: absolute; transform: translateX(-50%); top: 3px; font-size: .62rem; color: var(--ink-faint); white-space: nowrap; }
  .weekT .dh { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: .72rem; color: var(--ink-soft); border-top: 1px solid var(--line); }
  .weekT .dh b { font-size: .92rem; color: var(--ink); font-weight: 600; }
  .weekT .dh.todayrow, .weekT .dh.todayrow b { color: var(--primary-deep); }

  .weekT .vline { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }

  /* ---------- ปุ่มเพิ่มลอย ---------- */
  .fab { position: fixed; right: 18px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 25;

  .inp { width: 100%; border: 1.5px solid transparent; background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line);
         padding: 12px 14px; font-size: 1rem; transition: border-color .15s; }

  .save { width: 100%; margin-top: 22px; background: var(--primary); color: var(--on-primary); border: none;

  .save:hover { filter: brightness(1.05); }
  .del-btn { width: 100%; margin-top: 10px; background: none; border: none; color: var(--over); font-weight: 600; font-size: .9rem; padding: 10px; }

  /* แจ้งเตือนในแอป */
  .toast-wrap { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 60;

  .toast { background: var(--invert-bg); color: var(--invert-fg); padding: 12px 18px; border-radius: 16px; font-size: .9rem;

           align-items: center; animation: drop .3s cubic-bezier(.32,.72,0,1); }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--soon); flex: none; }
  @keyframes drop { from { transform: translateY(-120%); opacity: 0; } to { transform: none; opacity: 1; } }

  .hint { background: var(--teal-soft); color: var(--primary-deep); border-radius: 16px; padding: 12px 14px; font-size: .86rem;
          margin: 4px 0 10px; display: flex; gap: 10px; align-items: center; }
  .hint button { margin-left: auto; background: var(--primary); color: var(--on-primary); border: none; padding: 7px 14px;
                 border-radius: 10px; font-weight: 600; font-size: .82rem; flex: none; }
  .hint.dismissed { display: none; }

  /* กล่องยืนยัน */
  #dlgScrim { z-index: 70; }
  .dialog { position: fixed; z-index: 80; left: 50%; top: 50%; transform: translate(-50%, -46%) scale(.96);
            width: calc(100% - 56px); max-width: 360px; background: var(--card); border-radius: 22px;
            box-shadow: var(--shadow-lift); padding: 24px 20px 16px; opacity: 0; pointer-events: none;
            transition: opacity .18s, transform .18s; }

  .dialog p { font-size: 1rem; font-weight: 500; text-align: center; margin-bottom: 18px; line-height: 1.55; }
  .dlg-actions { display: flex; gap: 10px; }
  .dlg-actions button { flex: 1; padding: 13px; border-radius: 13px; font-weight: 600; font-size: .95rem; border: none; }
  .dlg-cancel { background: var(--field); color: var(--ink); }
  .dlg-ok { background: var(--over); color: var(--on-primary); }

  /* ---------- สอบ: เด่นขึ้น (การ์ดวันนี้, คาบที่มีสอบ, ปฏิทิน, สัปดาห์) ---------- */
  .pill.exam-solid { background: linear-gradient(135deg, var(--exam-a), var(--exam-b)); color: var(--on-exam); cursor: pointer; }
  .card.class-card.has-exam { background: color-mix(in srgb, var(--exam) 10%, var(--card)); box-shadow: inset 0 0 0 2px var(--exam), var(--shadow); }
  .card.class-card.has-exam .title { color: var(--ink); }
  .card.exam-card { background: color-mix(in srgb, var(--exam) 8%, var(--card)); box-shadow: inset 3px 0 0 var(--exam), var(--shadow); }
  .card.exam-card .title { font-size: 1.05rem; }
  .stat.exam { background: var(--exam-soft); }
  .stat.exam b { color: var(--exam); }

                 box-shadow: inset 3px 0 0 var(--exam); }
  .ag-row.exam .ag-c { color: var(--exam); }
  .cal-cell.has-exam { background: var(--exam-soft); }

  .cal-cell.sel.has-exam .dn { color: var(--invert-fg); }
  .cal-dots i.ex { width: 12px; border-radius: 3px; }
  .cal-chips { display: none; }

  /* ---------- โปรเจกต์: แยก ไอเดีย / กำลังทำ / เสร็จแล้ว (มือถือ = แถบสลับ, คอม = 3 คอลัมน์) ---------- */
  .proj-seg { margin: 0 0 12px; }
  .proj-seg button .n { font-size: .72rem; font-weight: 500; opacity: .7; margin-left: 5px; font-variant-numeric: tabular-nums; }

  .proj-col-head i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .proj-col-head .count { background: var(--card); color: var(--ink-soft); font-size: .72rem; font-weight: 600; padding: 1px 8px;

  .today-grid { display: block; }

  /* ---------- คอม: เมนูด้านข้าง + เนื้อหากว้าง ---------- */
  @media (min-width: 900px) {
    .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100dvh; }

            background: var(--card); border-right: 1px solid var(--line); }

    .side nav button svg { width: 20px; height: 20px; flex: none; }

    nav.tabs, .fab { display: none; }
    .app { max-width: 1120px; width: 100%; padding-bottom: 40px; }
    header.top { top: 0; padding: 28px 36px 16px; }
    header.top h1 { font-size: 2.1rem; }
    .add-btn { display: inline-flex; }
    main { padding: 6px 36px 40px; }
    /* ความกว้างตามหน้า: วันนี้/การบ้าน/นัด = คอลัมน์เดียวอยู่กลางจอ (หัวข้อด้วย) · ปฏิทิน/สัปดาห์ = กว้าง */
    .app[data-w="narrow"] { max-width: 832px; }

    /* ปฏิทินใหญ่: ตารางเดือนกินพื้นที่ส่วนใหญ่ ช่องวันสูงพอดีจอ โชว์ชื่อรายการในช่อง */
    .cal-layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(300px, 1fr); column-gap: 28px; align-items: start; }
    .cal-left { position: sticky; top: 104px; }
    .cal-head .mo { font-size: 1.55rem; }
    .cal-grid { gap: 4px; padding: 12px; }
    .cal-dow { font-size: .78rem; padding-bottom: 6px; }
    .cal-cell { aspect-ratio: auto; min-height: clamp(78px, calc((100dvh - 300px) / 6), 150px); align-items: stretch; padding: 6px; gap: 4px;
                border: 1px solid var(--line); }
    .cal-cell:hover { border-color: var(--line-strong); }
    .cal-cell:hover .dn { background: none; }
    .cal-cell .dn { width: 28px; height: 28px; font-size: .9rem; align-self: flex-start; }
    .cal-cell.sel { border-color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--ink-soft); }
    .cal-cell.dim { opacity: .5; }
    .cal-cell.has-exam { border-color: color-mix(in srgb, var(--exam) 45%, transparent); }
    .cal-dots { display: none; }
    .cal-chips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cc { display: block; font-size: .68rem; line-height: 1.4; padding: 1px 6px; border-radius: 6px; font-weight: 600;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cc.ex { background: linear-gradient(135deg, var(--exam-a), var(--exam-b)); color: var(--on-exam); }

    .cc.ap { background: var(--amber-soft); color: var(--soon-ink); }

    .sheet { left: 50%; right: auto; top: 50%; bottom: auto; width: min(580px, calc(100vw - 48px)); margin: 0; border-radius: 24px;

<div class="shell">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>

/* ===== ① ตั้งค่า Firebase: วาง config ของโปรเจกต์คุณตรงนี้ (null = ใช้แบบเครื่องเดียว) ===== */

const COLLS = ['classes','routines','homework','appts','exams','projects','notes','occasions','topics'];
/* ===== ② Push: วาง "Web Push certificate (VAPID key)" จาก Firebase Console ตรงนี้ (เว้นไว้ = ไม่เปิด push) ===== */

/* ---------- เก็บในเครื่อง (ค่าเริ่มต้น / ใช้ออฟไลน์) ---------- */
const LocalStore = (() => {
  const KEY = 'planner.v1';
  const listeners = new Set();
  let data = load();
  function load() { try { return { ...base(), ...(JSON.parse(localStorage.getItem(KEY)) || {}) }; } catch { return base(); } }
  function base() { return { classes: [], routines: [], homework: [], appts: [], exams: [], projects: [], notes: [], occasions: [], topics: [] }; }
  function persist() { localStorage.setItem(KEY, JSON.stringify(data)); emit(); }
  function emit() { listeners.forEach(fn => fn(data)); }
  return {
    all: (c) => data[c] || [],
    subscribe(fn) { listeners.add(fn); fn(data); return () => listeners.delete(fn); },
    add(c, item) { if (!data[c]) data[c] = []; item.id = item.id || crypto.randomUUID(); data[c].push(item); persist(); return item.id; },
    update(c, id, patch) { const i = data[c].find(x => x.id === id); if (i) Object.assign(i, patch); persist(); },
    remove(c, id) { data[c] = data[c].filter(x => x.id !== id); persist(); },
  };
})();

/* ---------- เริ่ม Firebase (ถ้ามี config) ---------- */

    fbReady = true;

}

/* ---------- เก็บบนคลาวด์ (Firestore) — แมป API เดียวกับ LocalStore ---------- */
function makeCloudStore(code) {
  const space = _db.collection('spaces').doc(code);
  const cache = { classes:[], routines:[], homework:[], appts:[], exams:[], projects:[] };
  const listeners = new Set();
  const emit = () => listeners.forEach(fn => fn(cache));
  COLLS.forEach(c => space.collection(c).onSnapshot(
    snap => { cache[c] = snap.docs.map(d => ({ id:d.id, ...d.data() })); emit(); },
    err => console.warn('ซิงค์ผิดพลาด', c, err)
  ));
  return {
    all: c => cache[c] || [],
    subscribe(fn){ listeners.add(fn); fn(cache); return () => listeners.delete(fn); },
    add(c, item){ item.id = item.id || crypto.randomUUID(); space.collection(c).doc(item.id).set(item); return item.id; },
    update(c, id, patch){ space.collection(c).doc(id).set(patch, { merge:true }); },
    remove(c, id){ space.collection(c).doc(id).delete(); },
    __cloud: true, __code: code,
  };
}

/* ---------- สร้าง/เข้าร่วมพื้นที่ซิงค์ ---------- */
async function createSpace() {
  if (!fbReady) return;
  const code = crypto.randomUUID();
  const space = _db.collection('spaces').doc(code);
  for (const c of COLLS) for (const item of LocalStore.all(c)) await space.collection(c).doc(item.id).set(item);
  setSyncCode(code); location.reload();
}
function joinSpace(code) {
  code = (code||'').trim();
  if (code.length < 8) return warn('รหัสไม่ถูกต้อง ลองคัดลอกใหม่จากเครื่องหลัก');

}

/* ===================== ตัวช่วยเรื่องเวลา ===================== */
const TH_DAY = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_DAY_S = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function fmtDate(d) { return `${TH_DAY[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]}`; }
function fmtTime(d) { return d.toTimeString().slice(0,5); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }

function countdown(target) {
  const ms = new Date(target) - Date.now();
  const past = ms < 0, a = Math.abs(ms);
  const min = Math.floor(a/60000), hr = Math.floor(min/60), day = Math.floor(hr/24);
  let txt;
  if (day >= 1) txt = `${day} วัน ${hr%24} ชม.`;
  else if (hr >= 1) txt = `${hr} ชม. ${min%60} น.`;
  else txt = `${min} นาที`;
  let cls = 'pill';
  if (past) cls = 'pill over';
  else if (ms < 24*3600000) cls = 'pill soon';
  return { txt: past ? `เลย ${txt}` : `อีก ${txt}`, cls, ms };
}

/* ---------- วันนี้ (แดชบอร์ด) ---------- */
const toMin = t => { const [hh, mm] = (t || '0:0').split(':').map(Number); return hh*60 + mm; };
function durText(m){ return m >= 60 ? `${Math.floor(m/60)} ชม.${m%60 ? ` ${m%60} น.` : ''}` : `${m} นาที`; }
function nowCard(classes, now, s){
  const card = el('div','now-card');
  const mins = now.getHours()*60 + now.getMinutes();
  const cur = classes.find(c => toMin(c.start) <= mins && mins < toMin(c.end));
  const next = classes.find(c => toMin(c.start) > mins);
  const where = c => c.online ? ' · ออนไลน์' : (c.room ? ' · ' + esc(c.room) : '');
  let x = '';
  if (cur) {
    const pct = Math.round((mins - toMin(cur.start)) / Math.max(1, toMin(cur.end) - toMin(cur.start)) * 100);
    card.style.setProperty('--nc', cur.color || 'var(--primary)');
    x += `<div class="nc-lbl">กำลังเรียน</div><div class="nc-sub">${esc(cur.subject)}</div>
          <div class="nc-meta">${cur.start}–${cur.end}${where(cur)} · เหลือ ${durText(toMin(cur.end) - mins)}</div>
          <div class="nc-bar"><i style="width:${pct}%"></i></div>`;
    if (next) x += `<div class="nc-next">ต่อไป <b>${esc(next.subject)}</b> ${next.start}</div>`;
  } else if (next) {
    card.style.setProperty('--nc', next.color || 'var(--primary)');
    x += `<div class="nc-lbl">คาบถัดไป</div><div class="nc-sub">${esc(next.subject)}</div>
          <div class="nc-meta">เริ่ม ${next.start}${where(next)} · อีก ${durText(toMin(next.start) - mins)}</div>`;
  } else {
    x += `<div class="nc-lbl">${fmtDate(now)}</div><div class="nc-sub">${classes.length ? 'เรียนครบทุกคาบแล้ววันนี้' : 'วันนี้ไม่มีคาบเรียน'}</div>`;
  }
  x += `<div class="stats">
      <button type="button" class="stat" data-go="todo"><b>${s.openToday}</b><span>ต้องทำวันนี้</span></button>
      <button type="button" class="stat${s.overdueN ? ' alert' : ''}" data-go="hw"><b>${s.overdueN}</b><span>เลยกำหนด</span></button>
      <button type="button" class="stat${s.exams7 ? ' exam' : ''}" data-go="cal"><b>${s.exams7}</b><span>สอบใน 7 วัน</span></button></div>`;
  card.innerHTML = x;
  card.querySelectorAll('.stat').forEach(b => b.onclick = () => {
    if (b.dataset.go === 'todo') { const t = $('#todayTodo'); if (t) t.scrollIntoView({ behavior:'smooth', block:'start' }); }
    else switchTab(b.dataset.go);
  });
  return card;
}
function renderToday() {
  const f = qKeepFocus(document.querySelector('.quick[data-qid="quickIn"]'));
  renderTodayInner(); qRestoreFocus(f);
}
function renderTodayInner() {
  const root = $('#todayContent'); root.innerHTML = '';
  const now = new Date(), dow = now.getDay();
  const grid = el('div','today-grid'), A = el('div','tcol-a'), B = el('div','tcol-b');
  root.appendChild(quickBar({ id:'quickIn', state: quickState, kbd: true }));
  grid.append(A, B); root.appendChild(grid);

  if (fbReady && !getSyncCode()) {
    const b = el('div','hint');
    b.innerHTML = `<span>ตั้งค่าซิงค์ให้ข้อมูลเด้งครบทุกเครื่อง</span>`;
    const btn = el('button', '', 'ตั้งค่า'); btn.onclick = openSyncSheet; b.appendChild(btn);
    A.appendChild(b);
  }

  const classes = Store.all('classes').filter(c => c.day === dow).sort((a,b)=>a.start.localeCompare(b.start));

  // สิ่งที่ต้องทำ — วันนี้ / พรุ่งนี้
  const tmr = new Date(now); tmr.setDate(now.getDate()+1);
  const todayY = ymd(now);
  // งานครั้งเดียวที่เลยกำหนดแล้วยังไม่เสร็จ — ยกยอดมาไว้วันนี้จนกว่าจะติ๊กเสร็จ
  const overdue = Store.all('routines')
    .filter(r => (r.repeat==='once'||r.date) && r.date && !r.done && r.date < todayY)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const todoToday = [...overdue, ...routinesFor(now)];
  const todoTmr = routinesFor(tmr);
  // การบ้าน + นัด: เหลือ ≤ 24 ชม. (รวมการบ้านที่เลยกำหนด) → วันนี้, 24–48 ชม. → พรุ่งนี้
  const H = 3600000, nowMs = now.getTime();
  const dueSoon = [];
  Store.all('homework').filter(h=>!h.done).forEach(h => dueSoon.push({ id:h.id, ms:new Date(h.dueAt)-nowMs, card:()=>hwCard(h) }));
  Store.all('appts').forEach(a => { const ms = new Date(a.at)-nowMs; if (ms > -12*H) dueSoon.push({ id:a.id, ms, card:()=>apptCard(a) }); });
  dueSoon.sort((x,y)=> x.ms - y.ms);
  const soonToday = dueSoon.filter(x => x.ms <= 24*H);
  const soonTmr = dueSoon.filter(x => x.ms > 24*H && x.ms <= 48*H);
  const movedIds = new Set([...soonToday, ...soonTmr].map(x => x.id));

  // สรุปบนสุด: คาบตอนนี้/ถัดไป + ตัวเลขสำคัญ
  const stats = {
    openToday: soonToday.length + todoToday.filter(r => !r.done).length,
    overdueN: Store.all('homework').filter(h => !h.done && new Date(h.dueAt) < now).length + overdue.length,
    exams7: Store.all('exams').filter(e => { const ms = new Date(e.at) - now; return ms > 0 && ms <= 7*86400000; }).length,
  };
  A.appendChild(nowCard(classes, now, stats));

  // วันสอบที่ใกล้ถึง
  Store.all('exams').filter(e => new Date(e.at) - nowMs > -6*H)
    .sort((a,b)=>new Date(a.at)-new Date(b.at)).slice(0,2)
    .forEach(e => A.appendChild(examHero(e)));

  // คาบเรียนวันนี้ (คาบที่ผ่านไปแล้วจางลง)
  if (classes.length) {
    const mins = now.getHours()*60 + now.getMinutes();
    A.appendChild(eyebrow('คาบเรียนวันนี้', classes.length));
    classes.forEach(c => A.appendChild(classCard(c, true,
      toMin(c.end) <= mins ? 'past' : toMin(c.start) <= mins ? 'now' : '')));
  }

  if (todoToday.length || soonToday.length) {
    const eb = eyebrow('สิ่งที่ต้องทำวันนี้', todoToday.length + soonToday.length); eb.id = 'todayTodo';
    B.appendChild(eb);
    soonToday.forEach(x => B.appendChild(x.card()));
    todoToday.forEach(r => B.appendChild(todoCard(r)));
  }
  if (todoTmr.length || soonTmr.length) {
    B.appendChild(eyebrow('สิ่งที่ต้องทำพรุ่งนี้', todoTmr.length + soonTmr.length));
    soonTmr.forEach(x => B.appendChild(x.card()));
    todoTmr.forEach(r => B.appendChild(todoCard(r)));
  }

  // ใกล้ถึงกำหนด: การบ้าน + นัด + วันสำคัญ รวมกัน เรียงตามเวลา (เฉพาะภายใน 100 วัน)
  const up = [];
  Store.all('homework').filter(h=>!h.done).forEach(h => up.push({when:new Date(h.dueAt), kind:'hw', item:h}));
  Store.all('appts').forEach(a => up.push({when:new Date(a.at), kind:'ap', item:a}));
  Store.all('occasions').forEach(o => up.push({when:nextOccur(o), kind:'oc', item:o}));
  up.sort((x,y)=> x.when - y.when);
  const recent = up.filter(u => u.when - now > -12*H && !movedIds.has(u.item.id)); // ที่ย้ายขึ้นวันนี้/พรุ่งนี้แล้วไม่ซ้ำ
  const future = recent.filter(u => dDays(u.when) <= 100);

  B.appendChild(eyebrow('ใกล้ถึงกำหนด', future.length));
  if (!future.length) B.appendChild(empty('🌤️','ตอนนี้ยังไม่มีอะไรใกล้ถึงกำหนด สบายๆ'));
  future.forEach(u => B.appendChild(u.kind==='hw' ? hwCard(u.item) : u.kind==='ap' ? apptCard(u.item) : occasionCard(u.item)));
  const seeAllH = el('button','see-all', `ดูทั้งหมดในปฏิทิน →`);
  seeAllH.onclick = ()=>switchTab('cal');
  B.appendChild(seeAllH);

  // สิ่งที่ต้องทำภายในสัปดาห์นี้ — เฉพาะที่ครบกำหนดไม่เกินสิ้นสัปดาห์นี้
  const eow = endOfWeek(now, 0);
  const cdTasks = Store.all('routines')
    .filter(r => r.countdown && !r.done && new Date(r.date+'T'+(r.time||'23:59')+':00') <= eow)
    .sort((a,b)=> new Date(a.date+'T'+(a.time||'23:59')) - new Date(b.date+'T'+(b.time||'23:59')));
  if (cdTasks.length) {
    B.appendChild(eyebrow('สิ่งที่ต้องทำภายในสัปดาห์นี้', cdTasks.length));
    cdTasks.forEach(r => B.appendChild(todoCard(r)));
  }
}

function eyebrow(text, count) {
  const e = el('div','eyebrow', text);
  if (count != null) e.appendChild(el('span','count', String(count)));
  return e;

/* ---------- การ์ดแต่ละชนิด ---------- */
// สอบของคาบนี้ในวันนั้น: เวลาชนกัน หรือชื่อวิชาตรงกัน (รหัสวิชาแบบ BBA21467 ก็นับ)
function classExams(c, date){
  const code = x => ((x || '').match(/[a-z]{2,4}\s?\d{3,6}/i) || [''])[0].replace(/\s/g, '').toLowerCase();
  const cs = toH(c.start), ce = toH(c.end), cn = (c.subject || '').toLowerCase().trim();
  return Store.all('exams').filter(e => {
    const d = new Date(e.at); if (!sameYMD(d, date)) return false;
    const s = d.getHours() + d.getMinutes() / 60, en = (e.subject || '').toLowerCase().trim();
    const overlap = s < ce && s + 1.5 > cs;
    const same = cn && en && en !== 'สอบ' && (en.includes(cn) || cn.includes(en) || (code(en) && code(en) === code(cn)));
    return overlap || same;
  }).sort((a, b) => new Date(a.at) - new Date(b.at));
}
function nextDateOfDow(dow){ const d = startOfDay(new Date()); d.setDate(d.getDate() + ((dow - d.getDay() + 7) % 7)); return d; }
function classCard(c, compact, state, date) {
  const exs = classExams(c, date || nextDateOfDow(c.day));
  const card = el('div','card class-card' + (state ? ' ' + state : '') + (exs.length ? ' has-exam' : ''));
  card.style.setProperty('--c', c.color || 'var(--primary)');
  card.appendChild(el('div','tcol', `<b>${c.start}</b><span>${c.end}</span>`));
  const b = el('div','body');
  const t = el('div','title', esc(c.subject));
  if (exs.length) {
    const ep = el('span','pill exam-solid', `📝 สอบ ${fmtTime(new Date(exs[0].at))}`); ep.title = 'ดูรายละเอียดสอบ';
    ep.onclick = e => { e.stopPropagation(); openSheet('exams', exs[0]); };
    t.appendChild(ep);
  }
  if (state === 'now') t.appendChild(el('span','pill now','กำลังเรียน'));
  if (c.online) t.appendChild(el('span','pill online','ออนไลน์'));
  b.appendChild(t);
  const meta = (c.online ? onlineMeta(c, 'เข้าเรียน') : (c.room ? `<span>📍 ${esc(c.room)}</span>` : '')) +
               (compact ? '' : `<span>${TH_DAY[c.day]}</span>`);
  if (meta) b.appendChild(el('div','meta', meta));
  card.appendChild(b);
  if (!compact) card.appendChild(actions('classes', c));
  return card;
}

  card.appendChild(b); card.appendChild(actions('routines', r));

function domOn(dom, date){ const last = new Date(date.getFullYear(), date.getMonth()+1, 0).getDate(); return date.getDate() === Math.min(dom, last); }
function routinesFor(date){
  const dow = date.getDay();
  return Store.all('routines').filter(r => {
    if (r.countdown) return false;                        // นับถอยหลังโชว์ในลิสต์วันนี้แยก
    if (r.repeat==='monthly') return domOn(r.dom, date);
    if (r.repeat==='once' || r.date) return r.date && sameYMD(new Date(r.date+'T00:00:00'), date);
    return (r.days||[]).includes(dow);
  }).sort((a,b)=> (a.allDay?0:1)-(b.allDay?0:1) || (a.time||'').localeCompare(b.time||''));
}
function cdText(dateStr, timeStr){
  const ms = new Date(dateStr+'T'+(timeStr||'23:59')+':00') - Date.now();
  if (ms < 0) return { txt:'⚠ เลยกำหนด', over:true, soon:true };
  const totalMin = Math.floor(ms/60000), hr = Math.floor(totalMin/60), day = Math.floor(hr/24);
  let t;
  if (day >= 1) t = `${day} วัน ${hr%24} ชม.`;
  else if (hr >= 1) t = `${hr} ชม. ${totalMin%60} น.`;
  else t = `${totalMin} นาที`;
  return { txt:`⏳ เหลือ ${t}`, over:false, soon: ms < 24*3600000 };
}
function dDays(d){ return Math.round((startOfDay(new Date(d)) - startOfDay(new Date()))/86400000); }
function dCount(d){ const n=dDays(d); return n===0 ? 'วันนี้' : n>0 ? `อีก ${n} วัน` : `เลย ${-n} วัน`; }
function nextOccur(o){
  const base = new Date(o.date+'T00:00:00'), now = startOfDay(new Date());
  let d;
  if (o.repeat === 'monthly'){
    d = new Date(now.getFullYear(), now.getMonth(), base.getDate());
    while (d < now) d = new Date(d.getFullYear(), d.getMonth()+1, base.getDate());
  } else {
    d = new Date(now.getFullYear(), base.getMonth(), base.getDate());
    if (d < now) d = new Date(now.getFullYear()+1, base.getMonth(), base.getDate());
  }
  return d;
}
function occursOn(o, date){
  const base = new Date(o.date+'T00:00:00');
  return o.repeat === 'monthly' ? date.getDate()===base.getDate()
       : date.getMonth()===base.getMonth() && date.getDate()===base.getDate();
}

function nextMonthly(dom){
  const now = startOfDay(new Date());
  for (let i=0;i<2;i++){
    const y=now.getFullYear(), m=now.getMonth()+i, last=new Date(y, m+1, 0).getDate();
    const d=new Date(y, m, Math.min(dom, last));
    if (d>=now) return d;
  }
  return now;
}

  const out = [];
  Store.all('homework').filter(h=>!h.done).forEach(h=>{ const d=new Date(h.dueAt);
    out.push({ when:d, color:'var(--c-hw)', title:h.title, sub:'การบ้าน · ส่ง '+fmtDate(d), count:dCount(d), soon:dDays(d)<=7, tap:()=>openSheet('homework',h) }); });
  Store.all('appts').forEach(a=>{ const d=new Date(a.at); if(dDays(d)<0) return;
    out.push({ when:d, color:'var(--c-appt)', title:a.title, sub:'นัด · '+fmtDate(d)+' '+fmtTime(d), count:dCount(d), soon:dDays(d)<=7, tap:()=>openSheet('appts',a) }); });
  Store.all('exams').forEach(e=>{ const d=new Date(e.at); if(dDays(d)<0) return;
    out.push({ when:d, kind:'exam', color:'var(--exam)', title:e.subject, sub:'สอบ · '+fmtDate(d)+' '+fmtTime(d), count:dCount(d), soon:dDays(d)<=7, tap:()=>openSheet('exams',e) }); });
  Store.all('occasions').forEach(o=>{ const d=nextOccur(o);
    out.push({ when:d, color:'var(--routine)', title:o.title, sub:(o.repeat==='monthly'?'ทุกเดือน':'ทุกปี')+' · '+fmtDate(d), count:dCount(d), soon:dDays(d)<=7, tap:()=>openSheet('occasions',o) }); });
  Store.all('routines').filter(r=>!r.done).forEach(r=>{
    if (r.countdown){ const start=mondayOf(new Date(r.date+'T00:00:00')), n=dDays(start);
      out.push({ when:start, color:'var(--ink-soft)', title:r.title, sub:'สิ่งที่ต้องทำภายในสัปดาห์', count: n<=0?'เริ่มแล้ว':`อีก ${n} วันจะเริ่ม`, soon:n<=7, tap:()=>openSheet('routines',r) }); }

      out.push({ when:d, color:'var(--ink-soft)', title:r.title, sub:'สิ่งที่ต้องทำ · '+fmtDate(d), count:dCount(d), soon:dDays(d)<=7, tap:()=>openSheet('routines',r) }); }

  return out.sort((a,b)=> a.when - b.when);

  const appts = types.includes('appts') ? Store.all('appts').filter(a=>sameYMD(new Date(a.at),date)).map(a => {
    const d=new Date(a.at), s=d.getHours()+d.getMinutes()/60;
    return { s, e:(a.end && toH(a.end) > s ? toH(a.end) : s+1), title:'📌 '+esc(a.title), sub:fmtTime(d)+(a.end ? '–'+esc(a.end) : ''), color:'var(--soon)', data:['appts',a] }; }) : [];
  const wantExams = types.includes('exams');
  let exams = (wantExams || types.includes('classes')) ? Store.all('exams').filter(e=>sameYMD(new Date(e.at),date)).map(e => {
    const d=new Date(e.at), s=d.getHours()+d.getMinutes()/60;
    return { s, e:s+1.5, title:'📝 '+esc(e.subject), sub:fmtTime(d), color:'var(--exam)', data:['exams',e] }; }) : [];

  // คาบที่มีสอบ (เวลาชนหรือวิชาเดียวกัน) → มาร์กคาบเรียน · บล็อกสอบที่เวลาชนคาบ → ซ่อน (ไม่ให้ทับซ้ำ)
  classes.forEach(c => { const exs = classExams(c.data[1], date); if (exs.length) { c.exam = true; c.examData = ['exams', exs[0]]; c.examTime = fmtTime(new Date(exs[0].at)); } });
  if (classes.length && exams.length) exams = exams.filter(ex => !classes.some(c => ex.s < c.e && ex.e > c.s));
  if (!wantExams) exams = [];
  return [...classes, ...routines, ...appts, ...exams];
}
const WK_LEG = { classes:['var(--primary)','เรียน'], routines:['var(--routine)','กิจวัตร'], appts:['var(--soon)','นัด'], exams:['var(--exam)','สอบ'] };
// จัดเลนกันบล็อกที่เวลาทับกัน (แยกตามกลุ่มที่ทับกันจริง)
function layoutDay(items){
  const sorted = items.slice().sort((a,b)=>a.s-b.s||a.e-b.e);
  let cluster=[], clusterEnd=-1;
  const flush=()=>{ const lanes=[]; cluster.forEach(it=>{ let i=0; for(;i<lanes.length;i++){ if(it.s>=lanes[i]-1e-6){lanes[i]=it.e;it.lane=i;break;} } if(i===lanes.length){lanes.push(it.e);it.lane=i;} }); const n=lanes.length; cluster.forEach(it=>it.lanes=n); cluster=[]; };
  sorted.forEach(it=>{ if(cluster.length && it.s>=clusterEnd-1e-6){ flush(); clusterEnd=-1; } cluster.push(it); clusterEnd=Math.max(clusterEnd,it.e); });
  flush(); return sorted;
}

function buildWeekGrid(types, extraChrome, showLegend, rerender) {
  const container = el('div');
  const days = []; for (let i=0;i<7;i++){ const d=new Date(weekStart); d.setDate(weekStart.getDate()+i); days.push(d); }
  const perDay = days.map(d => layoutDay(weekItemsFor(d, types)));

  // ช่วงเวลา: อิงจากรายการจริง (ตัดช่องว่างหัวท้าย)
  let minH=24, maxH=0;
  perDay.forEach(items => items.forEach(it => { minH=Math.min(minH,Math.floor(it.s)); maxH=Math.max(maxH,Math.ceil(it.e)); }));
  if (minH>=maxH){ minH=8; maxH=16; }
  const span = maxH-minH; // ช่วงชั่วโมงทั้งหมด (ตัวหารสำหรับคำนวณ %)

  // หัว: นำทางสัปดาห์ + ปุ่มสลับแกน
  const head = el('div','cal-head');
  const prev=el('button','',ARROW_L), next=el('button','',ARROW_R);
  prev.onclick=()=>{ weekStart=new Date(weekStart); weekStart.setDate(weekStart.getDate()-7); rerender(); };
  next.onclick=()=>{ weekStart=new Date(weekStart); weekStart.setDate(weekStart.getDate()+7); rerender(); };
  const a=days[0], b=days[6];
  const range = a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${TH_MON[b.getMonth()]}`
                : `${a.getDate()} ${TH_MON[a.getMonth()]} – ${b.getDate()} ${TH_MON[b.getMonth()]}`;
  const swap=el('button','', SWAP_ICON); swap.title='สลับแกน เวลา/วัน';
  swap.onclick=()=>{ weekOrient = weekOrient==='dayRows' ? 'timeRows' : 'dayRows'; rerender(); };
  const tb=el('button','','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>'); tb.title='สัปดาห์นี้'; tb.onclick=()=>{ weekStart=mondayOf(new Date()); rerender(); };
  head.append(prev, el('div','mo', range), next, swap, tb);
  container.appendChild(head);

  if (showLegend) {
    const legend = el('div','wk-legend');
    legend.innerHTML = types.map(t=>{ const [c,l]=WK_LEG[t]; return `<span><i style="background:${c}"></i>${l}</span>`; }).join('');
    container.appendChild(legend);
  }

  const wrap = el('div','week-wrap');
  wrap.style.height = `calc(100dvh - ${extraChrome}px)`;
  wrap.style.minHeight = '280px';
  const today = new Date();
  let any=false;

  const blockHTML = (it) => `<b>${it.title}</b><small>${it.sub}</small>` + (it.exam ? `<span class="exam-tag">📝 สอบ ${it.examTime || ''}</span>` : '');
  const wireBlock = (blk, it) => {
    blk.style.setProperty('--c', it.color);
    blk.innerHTML = blockHTML(it);
    if (it.done) blk.style.opacity = '.5';
    if (it.data[0] === 'exams') blk.classList.add('is-exam');
    if (it.exam) { blk.classList.add('has-exam'); blk.onclick=()=>openSheet('exams', it.examData[1]); }
    else blk.onclick=()=>openSheet(it.data[0], it.data[1]);
  };

  let grid;
  if (weekOrient === 'dayRows') {
    // วันแนวตั้งซ้าย / เวลาแนวนอนบน
    wrap.style.overflowX = 'hidden';
    grid = el('div','weekT wkgrid');
    grid.style.gridTemplateColumns = `52px 1fr`;
    grid.style.gridTemplateRows = `20px repeat(7, 1fr)`;
    const corner=el('div'); corner.style.gridArea='1 / 1'; grid.appendChild(corner);
    const th=el('div','th'); th.style.gridArea='1 / 2';
    const step = span > 12 ? 3 : span > 7 ? 2 : 1;
    for (let h=minH; h<=maxH; h+=step){ const s=el('span','',`${h}:00`); s.style.left=((h-minH)/span*100)+'%'; th.appendChild(s); }
    grid.appendChild(th);
    days.forEach((d,i) => {
      const dh=el('div','dh' + (sameYMD(d,today)?' todayrow':'')); dh.style.gridArea=`${i+2} / 1`;
      dh.innerHTML=`${TH_DAY_S[d.getDay()]}<b>${d.getDate()}</b>`; grid.appendChild(dh);
      const lane=el('div','lane'); lane.style.gridArea=`${i+2} / 2`;
      for (let h=0; h<=span; h++){ const ln=el('div','vline'); ln.style.left=(h/span*100)+'%'; lane.appendChild(ln); }
      perDay[i].forEach(it => { any=true; const hgt=100/it.lanes; const blk=el('div','blk');
        blk.style.left=`calc(${(it.s-minH)/span*100}% + 2px)`;
        blk.style.width=`calc(${(Math.max(.25,it.e-it.s))/span*100}% - 3px)`;
        blk.style.top=`calc(${it.lane*hgt}% + 2px)`;
        blk.style.height=`calc(${hgt}% - 4px)`;
        wireBlock(blk, it); lane.appendChild(blk); });
      grid.appendChild(lane);
    });
  } else {
    // เวลาแนวตั้งซ้าย / วันแนวนอนบน
    wrap.style.overflowX = 'auto';
    grid = el('div','weekV wkgrid');
    grid.style.gridTemplateColumns = `38px repeat(7, minmax(74px,1fr))`;
    grid.style.gridTemplateRows = `auto 1fr`;
    const corner=el('div'); corner.style.gridArea='1 / 1'; grid.appendChild(corner);
    days.forEach((d,i) => {
      const wh=el('div','wh' + (sameYMD(d,today)?' todaycol':'')); wh.style.gridArea=`1 / ${i+2}`;
      wh.innerHTML=`${TH_DAY_S[d.getDay()]}<br><b>${d.getDate()}</b>`; grid.appendChild(wh);
    });
    const tc=el('div','tc'); tc.style.gridArea='2 / 1';
    for (let h=minH; h<=maxH; h++){ const s=el('span','',`${h}:00`); s.style.top=((h-minH)/span*100)+'%'; tc.appendChild(s); }
    grid.appendChild(tc);
    days.forEach((d,i) => {
      const col=el('div','col'); col.style.gridArea=`2 / ${i+2}`;
      for (let h=0; h<=span; h++){ const ln=el('div','hline'); ln.style.top=(h/span*100)+'%'; col.appendChild(ln); }
      perDay[i].forEach(it => { any=true; const w=100/it.lanes; const blk=el('div','blk');
        blk.style.top=`calc(${(it.s-minH)/span*100}% + 2px)`;
        blk.style.height=`calc(${(Math.max(.25,it.e-it.s))/span*100}% - 3px)`;
        blk.style.left=`calc(${it.lane*w}% + 2px)`;
        blk.style.width=`calc(${w}% - 4px)`;
        wireBlock(blk, it); col.appendChild(blk); });
      grid.appendChild(col);
    });
  }
  wrap.appendChild(grid);
  container.appendChild(wrap);
  if (!any) container.appendChild(empty('🗓️', types.length>1
    ? 'สัปดาห์นี้ยังว่าง — เพิ่มคาบเรียน/นัด/กิจวัตรได้เลย'
    : 'ยังไม่มีคาบเรียน — กดปุ่ม + เพิ่มได้เลย'));
  return container;
}
function toH(t){ const [h,m]=t.split(':').map(Number); return h + m/60; }

let revealedId = null;   // id ที่ปัดเปิดแถบเลื่อนไว้ (ใช้ร่วมทุก tab)
function moveInList(coll, list, id, dir){
  const i = list.findIndex(x=>x.id===id), j = i+dir;
  if (i<0 || j<0 || j>=list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((x,idx)=>{ if (x.order !== idx) Store.update(coll, x.id, { order: idx }); });
}
function reorderWrap(card, coll, list, id){
  const item = el('div','hw-item');
  item.appendChild(card);
  if (list.length > 1){
    const bar = el('div','reorder-bar' + (revealedId===id ? '' : ' hidden'));
    const up = el('button','','⌃ เลื่อนขึ้น'); up.onclick = ()=>moveInList(coll, list, id, -1);
    const dn = el('button','','⌄ เลื่อนลง'); dn.onclick = ()=>moveInList(coll, list, id, 1);
    bar.append(up, dn); item.appendChild(bar);
    if (revealedId===id) card.classList.add('swiped');
    addSwipeReveal(card, bar, id);
  }
  return item;
}

// ปัดขวาที่การ์ด → เผยแถบปุ่มเลื่อนขึ้น/ลงข้างล่าง (ปัดซ้ายเพื่อซ่อน)
function addSwipeReveal(card, bar, id){
  let x0=null, y0=null, horiz=false;
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    x0=e.clientX; y0=e.clientY; horiz=false;
  });
  card.addEventListener('pointermove', e => {
    if (x0==null) return;
    const dx=e.clientX-x0, dy=e.clientY-y0;
    if (!horiz && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)) horiz=true;
    if (horiz) card.style.transform = `translateX(${Math.max(-12, Math.min(dx,74))}px)`;
  });
  const end = e => {
    if (x0==null) return;
    const dx=(e.clientX ?? x0)-x0;
    card.style.transition='transform .18s'; card.style.transform='';
    setTimeout(()=>{ card.style.transition=''; }, 200);
    if (horiz && Math.abs(dx)>10) card._justSwiped = true;   // กันแตะเปิดหลังปัด
    if (horiz && dx>45){ bar.classList.remove('hidden'); card.classList.add('swiped'); revealedId=id; }
    else if (horiz && dx<-30){ bar.classList.add('hidden'); card.classList.remove('swiped'); if(revealedId===id) revealedId=null; }
    x0=null;
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  card.addEventListener('click', e => { if (card._justSwiped){ e.stopImmediatePropagation(); e.preventDefault(); card._justSwiped=false; } }, true);
}

let projCol = (() => { try { return localStorage.getItem('planner.projCol') || 'doing'; } catch { return 'doing'; } })();

function renderProjList() {
